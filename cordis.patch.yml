# dsh-edge-agent bundle patch — applied after the dsh-base layer.
# This patch is the ONLY patch needed when a profile lists
# `@deepseek-harness-edge-agent/dsh-edge-agent` in its bundles array.
#
# 2026-09-05 (§7.43): 默认 host = dsh-tui（mandatory primary）。bundle 本身仍
# profile-agnostic，可挂到 web / dsh-tui / 任意 profile；只是 install.sh 的默认
# 部署目标从 web 切到 dsh-tui。2026-09-11 进一步改 install.sh 为 --profiles=dsh-tui,web 并存启动，--with-web 完全弃用。
#
# 2026-09-03 (§7.31): dsh-edge-agent 是 profile-agnostic pure-plugin bundle。
# Previously had a separate profiles/dsh-edge-agent/cordis.patch.yml (459 lines)
# that was the profile overlay; that overlay is now deleted. Bundle is fully
# self-contained — `dsh plugin --profile <name> add -w $LOCAL_PKG` picks up every
# plugin in a single bundle layer with no profile overlay needed.
#
# 2026-09-04: http-api plugin re-enabled. Provides standalone HTTP entry
# point at :21017 for external consumers (mobile apps, third-party services).
# Web profile still uses dsh-web-app native chat (:3080) alongside http-api.
#
# Load order:
#   dsh-base → ...other bundles... → @deepseek-harness-edge-agent/dsh-edge-agent (this)
#   → ~/.dsh/profiles/<prof>/cordis.patch.yml (user skin)
#
# Layer-ordering rule resolves all 5 conflicts vs. dsh-web-app automatically:
#   * persona (system-prompt)         — last-write-wins → edge-agent wins
#   * agent-presets default           — last-write-wins → edge-agent wins
#   * tool-* enable/disable           — last-write-wins → edge-agent wins
#   * webserver port                  — never touched here → dsh-web-app wins (3080)
#   * input-guard coverage            — {global:true} hooks cover webui RPC

# ── surface-specific overrides over the dsh-base layer ────────────────────

# Deployment persona: the edge agent's default is a private-assistant tone
# (not "coding agent"). DSH_EDGE_PERSONA wins; default below.
# 2026-09-02: expanded to mirror the persona declared at the profile layer
# (so this bundle works standalone without the profile overlay).
- id: system-prompt
  config:
    persona: !!js process.env.DSH_EDGE_PERSONA ?? 'You are edge-agent, a privacy-first AI assistant running on the user\'s edge device. Answer in the user\'s language. Be concise and helpful. You have access to local tools for file operations and calculations when appropriate. For knowledge questions, current events, or complex reasoning, provide comprehensive answers. Use the tool registry (bash, read, write, edit, glob, grep, todo_write, web_search, web_fetch, skill, send_message, interrupt_agent, subagent_fork, local_file_read, local_file_write, local_calculate) when an action is required; call the matching tool with the correct parameter shape and never invent tool names. The `skill` tool loads detailed instructions for a named capability (e.g. lark-doc, lark-calendar); once you call skill({name}) and receive its content, use that content immediately to answer the user\'s question — do NOT call the same skill again. For local host queries (the user\'s own IP, hostname, disk, memory, kernel, running processes), call the `bash` tool directly with read-only commands — `ip addr`, `hostname -I`, `ifconfig`, `cat /proc/net/...`, `uname -a`, `df -h`, `free -h`, `uptime`, `ps aux`. Reserve the `skill` tool for explicit capability names the user invokes (e.g. `ets-discover` for scanning OTHER 密盒 devices on the LAN, `lark-doc` for Lark documents); do NOT use `ets-discover` to answer "my IP" or "本机局域网IP" — ets-discover broadcasts and returns other devices\' IPs, not the host\'s.'

# §7.100: 删除了 llm-deepseek 的 config override 行。宿主云路由
# （deepseek-official / deepseek-account）现在作为 cloud-llm delegate 的
# 转发目标，key / baseURL / reasoning 全归宿主自己的配置层（dsh-credentials
# + profile patch），edge 侧不再双头管理。需要 edge 自有云池的部署请显式
# 配置 CLOUD_LLM_*（走 cloud-llm-adapter 直连模式）。

# The edge agent creates/resumes its agent at runtime; no declarative
# agents are started at boot, and the configured agent list stays the
# base's empty default.
- id: agent-loop
  config:
    agents: []

# Approval policy: edge agent defaults to ASK everywhere (no
# danger-full-access by default; user must opt in via env var).
# On Windows the trust model matches every other terminal coding agent.
- id: approval
  config:
    policy: !!js "process.platform === 'win32' ? 'never' : ((process.env.DSH_EDGE_PERMISSION_MODE ?? 'ask') === 'danger-full-access' ? 'never' : 'ask')"

# Sessions live in the edge-agent specific JSONL store so the
# ~/.dsh-edge-agent/sessions directory is isolated from any other DSH
# bundle.
- id: session-persistence-jsonl
  config:
    root: !!js process.env.DSH_EDGE_SESSION_ROOT ?? (process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent/sessions'

# Sandbox: tighter than dsh-base (workspace-write, not danger-full-access).
# On Windows the no-sandbox trust model applies.
- id: sandbox-policy
  config:
    mode: !!js "process.platform === 'win32' ? 'danger-full-access' : (process.env.DSH_EDGE_PERMISSION_MODE ?? 'workspace-write')"
    workspaceRoot: !!js process.cwd()

# §7.100: 删除了 agent-default-model override 行。宿主 profile 自己的选择
# （桌面 GUI saveSelection / dsh-base shipped deepseek-official）现在直接生效；
# http-api 路径不吃这个 row（intent resolveRoute → cloud-llm/local-llm，
# cloud-llm 在 delegate 模式下转发到宿主选择）——"profile 已配置模型提供商
# 就把它当 cloud-llm"的落点就在 delegate adapter，而不是改宿主全局默认。

# Persona + agent-presets delegation
#
# 2026-08-31: system-prompt row keeps the host deployment persona. The
# preset does NOT register its own `persona` row — that would conflict with
# this host row at the same NamedEntries table (both publish `deployment:persona`
# at host scope; the second one throws `prompt section already registered`).
# Shipped `standard` preset hits the same collision; it's an upstream bug
# in dsh 0.1.0-rc.7 (dsh-persona calls ctx.systemPrompt.section() which
# targets the systemPrompt service's own ctx, i.e. host, not the preset's
# standing scope).
#
# 2026-08-31: tool-skill moved to disabled=true at host plane. The preset
# registers its own `tool-skill` row, which joins the agent scope via
# parentage and registers into that scope's skill-registry layer.
#
# 2026-08-31: `agent-presets` config row pins the default preset to
# `dsh-edge-agent`. Moved to insert block (line 269) because TUI/headless
# profiles don't load dsh-web-app, so agent-presets must be inserted, not
# patched. See insert block for the active configuration.

# ── upstream-disabled rows ──────────────────────────────────────────────────────
# 2026-09-02: keep the disabled rows for the 7 stub plugins so any future
# downgrade (dsh-edge-agent bundle mounted alone, without the
# profiles/dsh-edge-agent overlay profile) still skips their apply() —
# they are M5+ work, not M4. The "dsh-edge-agent overlay" here refers
# to the default standalone profile directory, not a profile name; the
# bundle itself lives at the repo root.

# §7.100: 撤销了 llm-deepseek 的 disable —— 宿主云路由现在是 cloud-llm
# delegate 的转发目标，必须保持挂载。A4 (OHTTP) 届时替换的是 delegate
# 之下的 wire transport，不再是"edge 独占云路由"。
#
# §7.101.x (2026-10-20, fix #5): this `disabled: true` override is a NO-OP
# for the bare host-half row inserted below in the same file — cordis
# applies top-level overrides to already-existing entries only, and the
# insert creates the entry with that name. Kept as documentation of the
# standalone-profile intent (individual rows mount there).

- id: dsh-edge-agent
  disabled: true
  # Aggregator; 2026-09-03 (§7.31) dsh-edge-agent bundle 仅装 web profile
  # 一个, 但 aggregator 仍保持 disabled 避免 individual plugins (file-logger,
  # http-api, input-guard, etc.) double-apply。

- id: plugin-host
  disabled: true
- id: ohttp-gateway
  disabled: true
- id: secure-bridge
  disabled: true
- id: attestation
  disabled: true
- id: web-search
  disabled: true
- id: voice-input
  disabled: true

# ── tools (subset of dsh-base defaults restored after webui disables) ──────────
# 2026-09-02: when dsh-edge-agent is added to the web profile, dsh-web-app's
# layer (which comes BEFORE dsh-edge-agent) disables many tool rows. By
# re-declaring them here (last-write-wins), dsh-edge-agent overrides that
# disable with the upstream default. Standalone usage is unaffected.

# 启用的工具（明确 disabled: false 覆盖 dsh-web-app 的禁用）
- id: tool-bash
  disabled: false
- id: tool-fs
  disabled: false
- id: tool-fs-search
  disabled: false
- id: tool-web
  disabled: false
  config:
    search: true
    fetch: true
    searchMaxResults: 8
    searchTimeoutMs: 30000
    fetchTimeoutMs: 30000
- id: web
  # 2026-09-02: WebRuntime.Config (dsh-web/lib/index.js:42-50) requires BOTH
  # `searchProvider` AND `fetchProvider`. The upstream dsh-base row only
  # supplies `searchProvider`, so Cordis plugin-config validation rejects
  # the WebRuntime class plugin silently — `ctx.web` never gets provided,
  # web-search-deepseek's `inject: ['web']` never fires, and `web_search`
  # tool calls fail with "configured web provider ... is not registered".
  # 2026-09-04: fetchProvider now uses 'http' from dsh-web-fetch-http plugin.
  # 2026-09-18 (§7.82): searchProvider 改 tavily-bocha-fallback —— 三级链
  # provider(Tavily → 博查 AI → DeepSeek)。web-search-deepseek 仍 enabled 作
  # Tier-3 内部兜底(由 aggregator 私有 DeepSeekSearchProvider 实例调用,
  # 不暴露为独立 provider;否则 seam 会因 AMBIGUOUS 报错)。
  config:
    searchProvider: tavily-bocha-fallback
    fetchProvider: http
- id: tool-todo
  disabled: false
- id: tool-str-replace-editor
  disabled: false
- id: web-search-deepseek
  # 2026-09-04: RE-ENABLED. The 2026-09-03 comment claimed peer dep
  # `@deepseek-ai/dsh-environment` was missing. Wrong — actual peer deps are
  # `dsh-launch-environment`, `dsh-web`, `dsh-agent`, all in dsh scope (0.2.x line).
  # Without this plugin, `deepseek-official` search provider is never registered,
  # so web_search tool calls fail with "provider not registered".
  # 2026-09-18 (§7.82): DISABLED —— web-search-tavily-bocha 接管 searchProvider
  # 路由,在 aggregator 内部私有持有 DeepSeekSearchProvider 实例作 Tier-3
  # fallback。若两 plugin 同 enabled, ctx.web 会同时注册 2 个 usable provider
  # ('tavily-bocha-fallback' + 'deepseek-official') → AMBIGUOUS 报错。仍启用
  # 会留 orphan DeepSeek 注册 + 浪费一次 HTTP probe。
  disabled: true
- id: web-fetch-http
  # 2026-09-04: ENABLED. Provides the 'http' fetch provider for web_fetch tool.
  # Peer deps (cordis, dsh-timeout, dsh-web) all in dsh scope. Without this,
  # web_fetch tool calls fail with "fetchProvider not registered".

# 禁用的工具
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-skill
  # 2026-09-04 (§7.40.2): RE-ENABLED at host plane. Previously disabled
  # to avoid conflict with preset's tool-skill row. Empirically the
  # preset's row did NOT deliver the `skill` tool to the LLM — system-
  # prompt.assemble gathers toolProviders from the scope where dsh-tools
  # was constructed (host), so the bridge between ctx.tools.register() and
  # assembly.tools lives at host, not at the preset's standing scope. The
  # agent joined the standing scope by parentage but did not inherit the
  # toolProviders layer, so the `skill` tool was absent from the 27-tool
  # list while the system reminder kept telling the model to call it.
  # 2026-09-04 fix: disable the preset's row (single registration point)
  # and enable this host row. Session `cw-fix-test-1` and earlier
  # `7eb91d59-...` reproduced the 5-turn loop with resultLen=12
  # (`</tool_call>` residual) — LLM picked `tool-fs-search` instead and
  # produced malformed outputs.
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent-report
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-goal
  disabled: true
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  # 2026-09-04: ENABLED at host plane so realm-skill-bridge can access
  # ctx.skills.list() at boot. Previously disabled here because preset
  # registered its own skill-filesystem row, causing "a skill provider
  # named 'filesystem' is already registered" error. Now preset disables
  # its row to avoid conflict. realm-skill-bridge needs skills available
  # at host plane for Layer 1 catalog filtering.
  disabled: false
- id: skill-badge
  disabled: true
- id: workflow-worker-thread
  disabled: true
# 2026-08-31: goal service + driver + command re-enabled — required by
# the dsh-edge-agent preset's tool-goal row (which "waits for goals" if
# the host-plane service is missing). These are upstream dsh plugins
# mounted on the host plane; the preset's tool-goal row just provides the
# model-facing tool.
- id: goal
- id: goal-round-driver
- id: command-goal
- id: session-title-llm
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: repeat-tool-reminder
  disabled: true
- id: spill-local
  disabled: true
- id: spill-policy
  disabled: true
- id: session-checkpoint-policy
  disabled: true
- id: tool-result-pruner
  disabled: true
- id: tool-call-timeout-policy
  disabled: true
- id: compaction-basic
  disabled: true
- id: command-compact
  disabled: true

# ── new plugin inserts ─────────────────────────────────────────────────────────

# ── 2026-09-04: agent-presets — per-session agent composition.
# dsh-web-app inserts this for web profile; dsh-tui inserts a scoped copy
# (`dsh-tui-agent-presets`) for TUI/headless. We do NOT re-insert here —
# that produces either "service agentPresets has been registered" (when
# both rows enabled) or "duplicate loader entry id" (when both rows use
# the same id in an insert block). Instead we config-override the
# existing dsh-tui-agent-presets entry to flip its default from
# 'standard' to 'dsh-edge-agent', so TUI agents compose our preset (with
# ets-* skills) instead of dsh-base's standard one.
#
# §7.40.3 detail: top-level `- id:` rows with the same id as an existing
# entry are Cordis Loader config overrides (last-write-wins on config,
# single entry per id, dedup at parse time — vs insert block which adds
# new entries). This is the standard "user skin overrides bundle default"
# pattern. On web profile (no dsh-tui bundle), this id is unknown to the
# loader; Cordis silently no-ops the override, leaving dsh-web-app's
# own agent-presets insert as the source — which already sets
# default=dsh-edge-agent (verified in dsh-web-app bundle).
- id: dsh-tui-agent-presets
  config:
    default: dsh-edge-agent
    includeUserRoot: true

# ── 2026-09-01 (M6): file-logger — durable ops log exporter.
# Must mount FIRST so every other plugin's ctx.logger.* call (audit-log
# diagnostics, http-api req lines, td-bus blocks, etc.) lands on disk.
# No inject deps — Cordis loads plugins in dependency order, and this
# has none, so it runs before tcm / td-bus / audit-log / http-api.
# See `src/dsh-adapter/file-logger.ts` for the two-channel discipline
# (ops log: metadata only; audit JSONL: redacted call content).
- insert:
    # §7.101.x (2026-10-20, fix #5): BARE-package host-half row — REQUIRED
    # for the webview client bundle to be discovered at all. The webview
    # module system (@deepseek-ai/dsh-client-modules) scans loader entry
    # NAMES and its package locator only accepts bare package-root
    # specifiers (`exactPackageSpecifier`), so subpath rows can never
    # surface `dsh.client`. Same shape as dsh-context's single bare row.
    # inject: [] on lib/index.js means zero service deps; the apply() body
    # (file-logger install, upstream drift, plugin.ts boot event) is fully
    # best-effort/guarded. This row mounts the host half in profiles that
    # use this patch's insert list directly (desktop/web). The top-level
    # `- id: dsh-edge-agent / disabled: true` override above does NOT
    # disable it: the insert creates a new entry with the same name, and
    # cordis applies overrides to already-existing entries only.
    - id: dsh-edge-agent
      name: '@deepseek-harness-edge-agent/dsh-edge-agent'

    - id: file-logger
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/file-logger'
      config:
        # §7.102 "one config file": root / level / rotation come from
        # config/edge.json (audit.*) inside the plugin. Only static wiring
        # stays in the row. (Rotation semantics unchanged — see PROGRESS
        # §7.56; the effective values logMaxAgeDays=1 / logMaxRotated=7 /
        # logLevel=info are in edge.json.)
        filename: dsh-edge-agent.log
        flushIntervalMs: 1000
        queueCapacity: 10000
        maxFileSizeBytes: 52428800  # 50MB

    # tcm: prompt-guard injects this; must mount first
    - id: tcm
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/tcm'
      # §7.102: teeType / keyStorePath come from config/edge.json (tee.*).

    # td-bus: http-api injects this; must mount before http-api.
    # Config schema (`td-bus.ts`):
    #   - windowSeconds: number             (sliding window in seconds; default 60)
    #   - thresholds.cloudRequestsPerMinute: number (default 20)
    #   - blockLevel: 'elevated' | 'high' | 'critical'  (default 'critical')
    # Block triggers at 4× threshold within windowSeconds.
    - id: td-bus
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/td-bus'
      inject: [auditLog, privacyPolicy]
      config:
        windowSeconds: 60
        thresholds:
          cloudRequestsPerMinute: 8        # tighter than default 20 — escalate earlier
          failedSanitizationStreak: 3
          permissionDeniedStreak: 5
        blockLevel: critical                # block on critical (4× = 32/min)

    # realm-skill-bridge: realm-aware skill catalog filtering + tool gating.
    # Must mount before http-api (which injects realmSkillBridge).
    # §7.102: configPath / hot-reload knobs come from config/edge.json
    # (privacy.realm*). Row carries no config.
    - id: realm-skill-bridge
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/realm-skill-bridge'
      inject: [auditLog, skills, edgeTools, tools]

    # §7.102: host/port from config/edge.json http.*, session/body caps
    # from resources.*, bearer token from secrets.edgeApiKey — all filled
    # fill-if-unset in http-api.ts apply(). The bare EDGE_API_KEY env stays
    # a per-process override via edge-config's ENV_OVERRIDES. Row carries
    # no config.
    - id: http-api
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/http-api'
      inject: [agents, intentRouter, auditLog, tdBus, realmSkillBridge, edgeTools]

    - id: cloud-llm-adapter
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/cloud-llm-adapter'
      inject: [llm, auditLog]
      config:
        providers: [cloud-llm]
        # §7.100: 兜底链改为 `||`（空串视为未配置，根治 .env.sh export "" +
        # §7.102 (2026-10-21): 池配置 + delegate 旋钮迁到 config/edge.json
        # (llm.cloud.*)。patch 不再读 process.env —— 桌面 GUI 起进程时没有
        # 任何 DSH_EDGE_* 变量，读到的全是 undefined。
        #   baseUrl 空 = DELEGATE 模式：cloud-llm 路由转发到宿主 profile 已
        #   配置的模型提供商（GUI selection > live 宿主路由），key/凭据归
        #   宿主 adapter。显式配置 llm.cloud.baseUrl 才走自研直连。
        #   delegate=false → 禁用委托（LOCAL-only 部署；恢复 §7.35
        #   "云不可用→降级 LOCAL" 语义）
        #   delegateProvider → 显式指定目标路由 id
        #   delegateModel   → wire model override（压过 GUI selection.model）

    - id: local-llm-adapter
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/local-llm-adapter'
      inject: [llm, auditLog]
      config:
        providers: [local-llm]
        # §7.102: baseUrl / model / key / stripTools / enableThinking 全部
        # 来自 config/edge.json 的 llm.local.*。baseUrl 留空 = 不注册本地
        # LLM 路由（模型列表里不出现 local-llm，意图分类 / prompt-guard
        # 自动降级到关键词 / 正则规则档）。

    - id: model-router
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/model-router'
      inject: [llm]
      config:
        # §7.75: 删 defaultModel（v0.1.x 死字段，model-router.ts:143 构造时
        # 只接 localModels/cloudModels）。routing 由 intent 分类 + classificationProvider
        # 走 modelRouter.resolve() 决定，不靠"默认目标"变量
        localModels: [local-llm]
        cloudModels: [cloud-llm]

    - id: intent-router
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/intent-router'
      inject: [llm, auditLog, privacyPolicy]
      config:
        # 2026-09-02: changed from CLOUD to SANITIZED. Old default failed open
        # (ambiguous requests → CLOUD LLM, raw data egress). New default routes
        # through input-guard sanitizer first; sanitize failure downgrades to
        # LOCAL (fail-closed). See intent-router.ts:60 schema default.
        defaultCategory: SANITIZED
        # §7.102 (2026-10-21): 分类器 + jev 全部参数迁到 config/edge.json
        # (stages.intent.* / jev.*)。patch 不再读 process.env。

    # NOTE: id renamed from `tools` to avoid colliding with dsh-base.
    - id: edge-tools-registry
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/tools'
      inject: [auditLog, tools]
      config:
        defaultRateLimitPerMinute: 60
        enableToolIsolation: true
        presentationMode: native

    # §7.98:14 个**只读** etscli 子命令注册进 ctx.tools。
    #
    # 注册即安全边界:不在注册表里的工具不会出现在
    # realm-skill-bridge.getToolSchemasForExternal() 的产物里,needle 物理上选不中,
    # ctx.tools.execute() 也没法执行它。写/删类工具(auth logout / fs rm /
    # file delete / chat send / migrate verify …)一律**不注册**,排除依据见
    # src/dsh-adapter/etscli-tools.ts 模块头。
    #
    # 依赖 tools + shell:前者是注册表本体;后者提供子进程执行,白拿超时/中止
    # 判别、输出截断、凭据擦除 env、进程组 kill 升级 —— 不自己 spawn。
    # §7.102: etscliBin / timeoutMs come from config/edge.json (etscli.*).
    - id: etscli-tools
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/etscli-tools'
      inject: [tools, shell]

    - id: local-storage
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/local-storage'
      config:
        # §7.102: root comes from config/edge.json (storage.root), default
        # ~/.dsh-edge-agent/storage (2026-08-29 unified bundle root).
        filename: storage.plain.jsonl
        enablePIIRedaction: true

    # NOTE: `sessions` and `audit-log` are NOT mounted — `dsh-session`
    # provides `sessions` upstream and nothing provides `auditLog` so
    # audit-log is mounted below under its own name.
    #
    # ── sessions provider ── dsh-base already mounts the same package
    # under id `session-persistence-jsonl` (root: `dshHomePath('sessions')`),
    # which exposes `sessionPersistence`. Previously we declared a second
    # mount under id `sessions` — that caused a duplicate `provide()` call
    # and a hard boot failure after the loader upgrade in @xmanrui/dsh-im
    # (commit b42c7db). Keep the upstream mount; our session-root env
    # override (`DSH_EDGE_SESSION_ROOT`) flows through `dshHomePath()`.

    - id: audit-log
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/audit-log'
      config:
        # §7.102: minLevel / flush / root come from config/edge.json
        # (audit.*; root default = ~/.dsh-edge-agent/audit, 2026-08-29 统一).
        ringBufferSize: 512
        filename: audit.plain.jsonl
        enablePIIRedaction: true
        maxFileSizeBytes: 10485760  # 10MB
        maxFileAgeDays: 7
        maxRotatedFiles: 5

    # ── A1 端侧隐私安全防护 ─────────────────────────────────────────────────
    - id: prompt-guard
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/prompt-guard'
      inject: [auditLog, llm]
      config:
        maxInputLength: 10000
        maxRequestsPerMinute: 20
        enablePIIRedaction: true
        enableInjectionDetection: true
        enableRateLimit: true
        # §7.102 (2026-10-21): 模型检测配置迁到 config/edge.json
        # (stages.guard.*)。patch 不再读 process.env。

    # ── Phase 4: 隐私策略引擎 + 脱敏管线 ──────────────────────────────────
    - id: privacy-policy
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/privacy-policy'
      inject: [auditLog]
      # §7.102: row carries no config — policyPath / hot-reload 由
      # config/edge.json (privacy.*) 提供。
        # 2026-09-03 (§7.36): 默认 policy path 改为单 bundle root `~/.dsh-edge-agent/`。
        # §7.33 之前：fallback 到 `~/.dsh-edge-agent-web/`（web profile isolated root）。
        # §7.36：user 决定合并 web + tui → 单 root。DSH CLI 一次只跑一个 profile，
        # 所有 profile 共用同一份 policy 文件——跟 6 个 channel 数据合并一致。
        # §7.102: policyPath 默认 ~/.dsh-edge-agent/privacy-policy.json ——
        # 现由 config/edge.json (privacy.policyPath / policyHotReload /
        # policyWatchMs) 提供，行内不再保留。
        # 2026-09-03 (§7.36): 默认 policy path 单 bundle root（见 PROGRESS）。

    - id: sanitizer-pipeline
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/sanitizer-pipeline'
      inject: [privacyPolicy, auditLog]
      config:
        enableAutoDetection: true
        maxReplacementsPerSession: 1024
        # 明文 PII 映射表的生命周期兜底（2026-08-30）
        # §7.102: sessionTtlMs / maxSessions / sweepIntervalMs 迁到
        # config/edge.json (privacy.*)。patch 不再读 process.env。

    # ── Phase 5 (§7.82): Tavily → 博查 AI → DeepSeek 三级 web_search 兜底链
    # 注册一个 aggregator search provider(id='tavily-bocha-fallback')到 ctx.web;
    # web.searchProvider = 'tavily-bocha-fallback' 即指向它。任一 tier 抛错
    # (非 2xx / 网络 / JSON 解析) → 下一 tier 接续; 三 tier 都失败 →
    # WEB_PROVIDER_UNAVAILABLE。配置走裸名 env (§7.75: .env + .env.sh source
    # chain;避开 DSH 黑名单 DSH_/XDG_/DYLD_/BASH_FUNC_): TAVILY_API_KEY /
    # BOCHA_API_KEY / DEEPSEEK_API_KEY,都在 repo .env 里跟其他 secret 同地。
    - id: web-search-tavily-bocha
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/web-search-tavily-bocha'
      inject: [web]
      config:
        reserved: {}

    # ── Phase 6: input-guard 编排器 ────────────────────────────────────
    # 端侧隐私安全管线的编排器。把安全/隐私/脱敏逻辑从 transport 层
    # (http-api) 上移到 Agent Loop 的事件链上 (agent/pre-step + llm/stream)，
    # 让所有入口（http-api / Web UI / CLI / SDK）自动统一走同一套管线。
    #
    # 组合调用：
    #   promptGuard.checkInput   (攻击检测)
    #   privacyPolicy.matchRouting (策略 REJECT)
    #   intentRouter.classify    (LOCAL/CLOUD 路由)
    #   sanitizer.sanitize       (仅 CLOUD：PII → 占位符)
    #   sanitizer.desanitize     (输出方向：占位符 → PII)
    #
    # 设计详见：docs/input-guard-design.md

    # ── §7.93.1(2026-09-25 通用化):function-call-external 插件
    # 把 tool-call prefill 抽象成 ExternalToolCaller 接口(healthCheck +
    # extract);当前实现 = NeedleHttpCaller(cactus-needle 3.0.1,API.md v1.1)。
    # 后续替换 = 新增 class implements ExternalToolCaller + 改 apply() 一行。
    # **必须早于 input-guard apply**:本插件是 agent/pre-step waterfall 的最
    # 外层 listener(await next() 串到 input-guard,等 input-guard 的 classify +
    # setSessionRealm 完成后才返回,我们才看得到本 turn 的 realm)。
    # 否则读到 undefined 或上 turn 旧 realm → 触发跳过路径。
    # cordis waterfall 注册顺序 = 执行顺序(shift 第一个 = 最外层)。
    - id: function-call-external
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/function-call-external'
      inject: [auditLog, realmSkillBridge, tools]
      # §7.102: row carries no config — 全部旋钮由 config/edge.json
      # (functionCallExternal.*) 提供。默认关(user 终裁)。
        # §7.102 (2026-10-21): 全部旋钮迁到 config/edge.json
        # (functionCallExternal.*)。patch 不再读 process.env。
        # 当前实现 = cactus-needle 3.0.1:GET /health + POST /extract(stateless 无 /reset;
        # P1 中文数字归一化服务端内置;client 不做翻译,管什么语种 caller 自带 cn_grounding)。
        # functionCallExternalEnabled: !!js process.env.DSH_EDGE_FUNCTION_CALL_EXTERNAL_ENABLED === 'true'
        # functionCallExternalUrl: !!js process.env.DSH_EDGE_FUNCTION_CALL_EXTERNAL_URL ?? 'http://127.0.0.1:8081'
        # 实测 /extract 在 caller 当前 LAN 引擎下需 4-7s(dry-run #1 标 376-548ms 是
        # API.md spec 理想值,实际 25-30x degradation);10s 给单请求 1x 余量。
        # 后续引擎恢复 < 1s 时再调低。
        # functionCallExternalTimeoutMs: !!js parseInt(process.env.DSH_EDGE_FUNCTION_CALL_EXTERNAL_TIMEOUT_MS ?? '10000', 10)
        # functionCallExternalConfidenceThreshold: !!js parseFloat(process.env.DSH_EDGE_FUNCTION_CALL_EXTERNAL_CONFIDENCE_THRESHOLD ?? '0.5')
        # §7.92.6:circuit breaker(单 fetch 模式,open-on-first-failure,jev
        # all-batches 失败才开的等价位)。dry-run #1 验证 timeout 几乎全中,
        # breaker 必须计入 timeout。
        # functionCallExternalBreakerTtlMs: !!js parseInt(process.env.DSH_EDGE_FUNCTION_CALL_EXTERNAL_BREAKER_TTL_MS ?? '30000', 10)
        # §7.92.7:boot probe + 周期恢复 probe(GET /health)
        # functionCallExternalBootProbeEnabled: !!js process.env.DSH_EDGE_FUNCTION_CALL_EXTERNAL_BOOT_PROBE_ENABLED !== 'false'
        # functionCallExternalBootProbeTimeoutMs: !!js parseInt(process.env.DSH_EDGE_FUNCTION_CALL_EXTERNAL_BOOT_PROBE_TIMEOUT_MS ?? '2000', 10)
        # functionCallExternalBreakerProbeMs: !!js parseInt(process.env.DSH_EDGE_FUNCTION_CALL_EXTERNAL_BREAKER_PROBE_MS ?? '5000', 10)
        # functionCallExternalProbeTimeoutMs: !!js parseInt(process.env.DSH_EDGE_FUNCTION_CALL_EXTERNAL_PROBE_TIMEOUT_MS ?? '2000', 10)
    - id: input-guard
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/input-guard'
      inject: [promptGuard, privacyPolicy, intentRouter, sanitizer, auditLog]
      config:
        # §7.102 (2026-10-21): 开关 + 降级 model 迁到 config/edge.json
        # (privacy.* + llm.local.model)。patch 不再读 process.env。
        #   enableInputGuard          → 全局 hook 开关
        #   rejectOnPolicyViolation   → 攻击 / privacy-policy REJECT 阻断 step
        #   downgradeOnSanitizeFailure → sanitize 失败降级 LOCAL（fail-closed）
        #   localModel                → 降级目标 model，跟随 LOCAL 池
        sanitizeLocalTraffic: false