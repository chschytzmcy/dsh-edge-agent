# dsh-edge-agent bundle patch — applied after the dsh-base layer.
# This patch is BOTH the root-bundle patch (when dsh-edge-agent is consumed
# as a npm bundle) AND the only overlay needed when a profile lists
# `@deepseek-harness-edge-agent/dsh-edge-agent` in its bundles array.
#
# 2026-09-02: previously this was 102 lines (overrides + disabled rows).
# Profile lived in profiles/dsh-edge-agent/cordis.patch.yml (459 lines,
# carried the insert: block). Consolidated into this file so the bundle
# is self-contained — `dsh plugin --profile web add -w $LOCAL_PKG` now
# picks up every plugin in a single bundle layer.
#
# Load order:
#   dsh-base → ...other bundles... → @deepseek-harness-edge-agent/dsh-edge-agent (this)
#   → ~/.dsh/profiles/<prof>/cordis.patch.yml (user skin)
#
# Layer-ordering rule resolves all 5 conflicts vs. dsh-web-app automatically:
#   * persona (system-prompt)         — last-write-wins → edge-agent wins
#   * agent-presets default           — last-write-wins → edge-agent wins
#   * tool-* enable/disable           — last-write-wins → edge-agent wins
#   * webserver port                  — never touched here → dsh-web-app wins (3080)
#   * input-guard coverage            — {global:true} hooks cover webui RPC

# ── surface-specific overrides over the dsh-base layer ────────────────────

# Deployment persona: the edge agent's default is a private-assistant tone
# (not "coding agent"). DSH_EDGE_PERSONA wins; default below.
# 2026-09-02: expanded to mirror the persona declared at the profile layer
# (so this bundle works standalone without the profile overlay).
- id: system-prompt
  config:
    persona: !!js process.env.DSH_EDGE_PERSONA ?? 'You are edge-agent, a privacy-first AI assistant running on the user\'s edge device. Answer in the user\'s language. Be concise and helpful. You have access to local tools for file operations and calculations when appropriate. For knowledge questions, current events, or complex reasoning, provide comprehensive answers. Use the tool registry (bash, read, write, edit, glob, grep, todo_write, web_search, web_fetch, skill, send_message, interrupt_agent, subagent_fork, local_file_read, local_file_write, local_calculate) when an action is required; call the matching tool with the correct parameter shape and never invent tool names. The `skill` tool loads detailed instructions for a named capability (e.g. lark-doc, lark-calendar); once you call skill({name}) and receive its content, use that content immediately to answer the user\'s question — do NOT call the same skill again.'

# Native DeepSeek adapter for the cloud realm. The edge agent always
# prefers local-first; this row exists so cloud-llm-adapter can reach it.
# The DSH setting (apiKeyEnv) is honored; no key is stored in this bundle.
- id: llm-deepseek
  config:
    apiKeyEnv: !!js process.env.DSH_EDGE_CLOUD_KEY_ENV ?? 'DEEPSEEK_API_KEY'
    baseURL: !!js process.env.DEEPSEEK_BASE_URL
    thinking: enabled
    reasoningEffort: max

# The edge agent creates/resumes its agent at runtime; no declarative
# agents are started at boot, and the configured agent list stays the
# base's empty default.
- id: agent-loop
  config:
    agents: []

# Approval policy: edge agent defaults to ASK everywhere (no
# danger-full-access by default; user must opt in via env var).
# On Windows the trust model matches every other terminal coding agent.
- id: approval
  config:
    policy: !!js "process.platform === 'win32' ? 'never' : ((process.env.DSH_EDGE_PERMISSION_MODE ?? 'ask') === 'danger-full-access' ? 'never' : 'ask')"

# Sessions live in the edge-agent specific JSONL store so the
# ~/.dsh-edge-agent/sessions directory is isolated from any other DSH
# bundle.
- id: session-persistence-jsonl
  config:
    root: !!js process.env.DSH_EDGE_SESSION_ROOT ?? (process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent/sessions'

# Sandbox: tighter than dsh-base (workspace-write, not danger-full-access).
# On Windows the no-sandbox trust model applies.
- id: sandbox-policy
  config:
    mode: !!js "process.platform === 'win32' ? 'danger-full-access' : (process.env.DSH_EDGE_PERMISSION_MODE ?? 'workspace-write')"
    workspaceRoot: !!js process.cwd()

# Force the agent loop to a provider that edge-agent registered. The
# default in dsh-base is `deepseek-official`, which we just disabled.
- id: agent-default-model
  config:
    provider: !!js process.env.DSH_EDGE_PROVIDER ?? 'cloud-deepseek-v4'
    model: !!js process.env.DSH_EDGE_MODEL ?? 'deepseek-chat'

# Persona + agent-presets delegation
#
# 2026-08-31: system-prompt row keeps the host deployment persona. The
# preset does NOT register its own `persona` row — that would conflict with
# this host row at the same NamedEntries table (both publish `deployment:persona`
# at host scope; the second one throws `prompt section already registered`).
# Shipped `standard` preset hits the same collision; it's an upstream bug
# in dsh 0.1.0-rc.7 (dsh-persona calls ctx.systemPrompt.section() which
# targets the systemPrompt service's own ctx, i.e. host, not the preset's
# standing scope).
#
# 2026-08-31: tool-skill moved to disabled=true at host plane. The preset
# registers its own `tool-skill` row, which joins the agent scope via
# parentage and registers into that scope's skill-registry layer.
#
# 2026-08-31: `agent-presets` config row pins the default preset to
# `dsh-edge-agent`. The composer hardcodes `roots: [SHIPPED]`, so custom
# presets must live under `$DSH_HOME/.agent-presets/<name>/` (the
# `includeUserRoot: true` default auto-discovers them).
- id: agent-presets
  config:
    default: dsh-edge-agent
    # includeUserRoot defaults to true; explicitly set so future DSH
    # version changes don't silently disable our preset discovery.
    includeUserRoot: true

# ── upstream-disabled rows ──────────────────────────────────────────────────────
# 2026-09-02: keep the disabled rows for the 7 stub plugins so any future
# downgrade (dsh-edge-agent bundle mounted alone, without the
# profiles/dsh-edge-agent overlay profile) still skips their apply() —
# they are M5+ work, not M4. The "dsh-edge-agent overlay" here refers
# to the default standalone profile directory, not a profile name; the
# bundle itself lives at the repo root.

- id: llm-deepseek
  disabled: true
  # edge-agent owns the CLOUD provider route; the future A4 (OHTTP)
  # stage will swap the wire transport under cloud-llm-adapter.

- id: dsh-edge-agent
  disabled: true
  # Aggregator; the bundle can mount into any profile (see PROGRESS
  # §7.25 + §7.25.x), so the aggregator stays disabled to avoid
  # double-apply when individual plugins (file-logger, http-api, etc.)
  # are also wired with their own ids.

- id: plugin-host
  disabled: true
- id: ohttp-gateway
  disabled: true
- id: secure-bridge
  disabled: true
- id: attestation
  disabled: true
- id: web-search
  disabled: true
- id: voice-input
  disabled: true

# ── tools (subset of dsh-base defaults restored after webui disables) ──────────
# 2026-09-02: when dsh-edge-agent is added to the web profile, dsh-web-app's
# layer (which comes BEFORE dsh-edge-agent) disables many tool rows. By
# re-declaring them here (last-write-wins), dsh-edge-agent overrides that
# disable with the upstream default. Standalone usage is unaffected.

# 启用的工具
- id: tool-bash
- id: tool-fs
- id: tool-fs-search
- id: tool-web
  config:
    search: true
    fetch: true
    searchMaxResults: 8
    searchTimeoutMs: 30000
    fetchTimeoutMs: 30000
- id: web
  # 2026-09-02: WebRuntime.Config (dsh-web/lib/index.js:42-50) requires BOTH
  # `searchProvider` AND `fetchProvider`. The upstream dsh-base row only
  # supplies `searchProvider`, so Cordis plugin-config validation rejects
  # the WebRuntime class plugin silently — `ctx.web` never gets provided,
  # web-search-deepseek's `inject: ['web']` never fires, and `web_search`
  # tool calls fail with "configured web provider ... is not registered".
  # Provide a dummy `fetchProvider` here; tool-web disables fetch via
  # `config.fetch: false` so the seam is never actually used for fetch.
  config:
    searchProvider: deepseek-official
    fetchProvider: ''
- id: tool-todo
- id: tool-str-replace-editor
- id: web-search-deepseek
  # 2026-09-02: re-enabled. Original 2026-09-01 disable note claimed
  # peer dep `@deepseek-ai/dsh-environment` was blocked, but the actual
  # peer dep name is `@deepseek-ai/dsh-launch-environment` and that
  # package is now resolvable (verified via `node -e "import('@...')"`
  # at 2026-09-02). Web search enables LLM to answer real-time news
  # queries instead of falling back to "service unavailable" text.
  # If boot fails with ERR_MODULE_NOT_FOUND on dsh-launch-environment,
  # revert to disabled: true and investigate pnpm allow-list.

# 禁用的工具
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-skill
  # Disabled: dsh-edge-agent preset registers its own tool-skill row inside
  # an isolate group (see agent-presets/dsh-edge-agent/agent.cordis.yml),
  # which joins the agent scope via parentage. Leaving this host row
  # enabled would mean two tool-skill providers competing for the same
  # catalog slot — dsh-agent-presets rejects double-mount at session start.
  # realm-skill-bridge (mounted in the insert block below) filters the
  # merged catalog per realm regardless of which row registered the tool.
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent-report
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-goal
  disabled: true
- id: skill-filesystem
  # 2026-09-01: Disabled at host — the dsh-edge-agent agent preset registers
  # its own skill-filesystem row (see agent-presets/dsh-edge-agent/
  # agent.cordis.yml). Leaving both enabled throws "a skill provider named
  # 'filesystem' is already registered" at session start, blocking every
  # new chat in the Web UI. Mirrors the tool-skill pattern just above:
  # host owns the registry, preset owns the provider entries, realm-skill-
  # bridge filters the merged catalog per realm regardless of which row
  # registered the tool.
  disabled: true
- id: skill-badge
  disabled: true
- id: workflow-worker-thread
  disabled: true
# 2026-08-31: goal service + driver + command re-enabled — required by
# the dsh-edge-agent preset's tool-goal row (which "waits for goals" if
# the host-plane service is missing). These are upstream dsh plugins
# mounted on the host plane; the preset's tool-goal row just provides the
# model-facing tool.
- id: goal
- id: goal-round-driver
- id: command-goal
- id: session-title-llm
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: repeat-tool-reminder
  disabled: true
- id: spill-local
  disabled: true
- id: spill-policy
  disabled: true
- id: session-checkpoint-policy
  disabled: true
- id: tool-result-pruner
  disabled: true
- id: tool-call-timeout-policy
  disabled: true
- id: compaction-basic
  disabled: true
- id: command-compact
  disabled: true

# ── new plugin inserts ─────────────────────────────────────────────────────────

# ── 2026-09-01 (M6): file-logger — durable ops log exporter.
# Must mount FIRST so every other plugin's ctx.logger.* call (audit-log
# diagnostics, http-api req lines, td-bus blocks, etc.) lands on disk.
# No inject deps — Cordis loads plugins in dependency order, and this
# has none, so it runs before tcm / td-bus / audit-log / http-api.
# See `src/dsh-adapter/file-logger.ts` for the two-channel discipline
# (ops log: metadata only; audit JSONL: redacted call content).
- insert:
    - id: file-logger
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/file-logger'
      config:
        root: !!js process.env.DSH_EDGE_LOG_ROOT ?? ((process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent/log')
        filename: dsh-edge-agent.log
        flushIntervalMs: 1000
        queueCapacity: 10000
        maxFileSizeBytes: 52428800  # 50MB
        maxFileAgeDays: 0
        maxRotatedFiles: 5
        # 2026-09-02: default flipped info → debug so LLM body debug
        # calls (LLM_REQUEST / LLM_MESSAGES / LLM_RESPONSE /
        # LLM_RESPONSE_TEXT in cloud-llm-adapter.ts and
        # local-llm-adapter.ts) pass through to the ops log. Set
        # `DSH_EDGE_LOG_LEVEL=info` to revert to the pre-change quiet
        # behavior (no LLM body content on disk).
        level: !!js process.env.DSH_EDGE_LOG_LEVEL ?? 'debug'

    # tcm: prompt-guard injects this; must mount first
    - id: tcm
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/tcm'
      config:
        teeType: !!js process.env.DSH_EDGE_TEE_TYPE ?? 'simulated'
        keyStorePath: !!js (process.env.DSH_EDGE_STORAGE_ROOT ?? (process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent') + '/tcm-keys.json'

    # td-bus: http-api injects this; must mount before http-api.
    # Config schema (`td-bus.ts`):
    #   - windowSeconds: number             (sliding window in seconds; default 60)
    #   - thresholds.cloudRequestsPerMinute: number (default 20)
    #   - blockLevel: 'elevated' | 'high' | 'critical'  (default 'critical')
    # Block triggers at 4× threshold within windowSeconds.
    - id: td-bus
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/td-bus'
      inject: [auditLog, privacyPolicy]
      config:
        windowSeconds: 60
        thresholds:
          cloudRequestsPerMinute: 8        # tighter than default 20 — escalate earlier
          failedSanitizationStreak: 3
          permissionDeniedStreak: 5
        blockLevel: critical                # block on critical (4× = 32/min)

    # realm-skill-bridge: realm-aware skill catalog filtering + tool gating.
    # Must mount before http-api (which injects realmSkillBridge).
    - id: realm-skill-bridge
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/realm-skill-bridge'
      inject: [auditLog]
      config:
        configPath: !!js process.env.DSH_EDGE_REALM_CONFIG ?? ((process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent/skill-realms.json')
        hotReload: !!js process.env.DSH_EDGE_REALM_HOT_RELOAD !== 'false'
        watchIntervalMs: !!js parseInt(process.env.DSH_EDGE_REALM_WATCH_MS ?? '5000', 10)

    - id: http-api
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/http-api'
      inject: [agents, intentRouter, promptGuard, auditLog, sanitizer, realmSkillBridge, edgeTools]
      config:
        # 2026-08-29: 改为 0.0.0.0 开放监听（部署环境需要从外部访问 http-api）。
        # 安全约束：bearer token 必填（EDGE_API_KEY 不能为空）；生产部署务必
        # 在防火墙 / reverse proxy 层做 IP allowlist（部署责任）。
        host: !!js process.env.DSH_EDGE_HTTP_HOST ?? '0.0.0.0'
        port: !!js parseInt(process.env.DSH_EDGE_HTTP_PORT ?? '21017', 10)
        bearerToken: !!js process.env.EDGE_API_KEY ?? undefined
        # NOTE: requireAttestation removed 2026-08-29 — it was a dead config
        # field declared in http-api but never read. Attestation is an A5
        # milestone; re-add with the real check, not a decorative default.
        sessionIdleTimeoutMs: 1800000  # 30 min
        maxActiveSessions: 100

    - id: cloud-llm-adapter
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/cloud-llm-adapter'
      inject: [llm, auditLog]
      config:
        providers: [cloud-deepseek-v4]
        baseUrl: !!js process.env.DEEPSEEK_BASE_URL ?? 'https://api.deepseek.com'
        apiKeyEnv: DEEPSEEK_API_KEY
        defaultModel: !!js process.env.DSH_EDGE_MODEL ?? 'deepseek-chat'

    - id: local-llm-adapter
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/local-llm-adapter'
      inject: [llm, auditLog]
      config:
        providers: [local-qwen3-4b]
        baseUrl: !!js process.env.DSH_EDGE_LOCAL_LLM_BASEURL ?? 'http://192.168.1.121:11017/v1'
        defaultModel: !!js process.env.DSH_EDGE_LOCAL_LLM_MODEL ?? 'Qwen3-4B-Instruct-2507'
        apiKeyEnv: !!js process.env.DSH_EDGE_LOCAL_LLM_KEY_ENV ?? undefined

    - id: model-router
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/model-router'
      inject: [llm]
      config:
        defaultModel: !!js process.env.DSH_EDGE_MODEL_ROUTER_DEFAULT ?? 'cloud-deepseek-v4'
        localModels: [local-qwen3-4b]
        cloudModels: [cloud-deepseek-v4]

    - id: intent-router
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/intent-router'
      inject: [llm, auditLog]
      config:
        # 2026-09-02: changed from CLOUD to SANITIZED. Old default failed open
        # (ambiguous requests → CLOUD LLM, raw data egress). New default routes
        # through input-guard sanitizer first; sanitize failure downgrades to
        # LOCAL (fail-closed). See intent-router.ts:60 schema default.
        defaultCategory: SANITIZED
        classificationProvider: !!js process.env.DSH_EDGE_INTENT_PROVIDER ?? 'local-qwen3-4b'
        classificationModel: !!js process.env.DSH_EDGE_INTENT_MODEL ?? 'Qwen3-4B-Instruct-2507'
        confidenceThreshold: !!js parseFloat(process.env.DSH_EDGE_INTENT_CONFIDENCE_THRESHOLD ?? '0.6')
        llmTimeoutMs: !!js parseInt(process.env.DSH_EDGE_INTENT_LLM_TIMEOUT_MS ?? '4000', 10)
        recentMessagesLimit: !!js parseInt(process.env.DSH_EDGE_INTENT_RECENT_LIMIT ?? '3', 10)
        maxInputLength: !!js parseInt(process.env.DSH_EDGE_INTENT_MAX_INPUT ?? '2000', 10)
        fallbackKeywords: !!js (process.env.DSH_EDGE_INTENT_FALLBACK_KEYWORDS ?? '').split(',').filter(Boolean)

    # NOTE: id renamed from `tools` to avoid colliding with dsh-base.
    - id: edge-tools-registry
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/tools'
      inject: [auditLog, tools]
      config:
        defaultRateLimitPerMinute: 60
        enableToolIsolation: true
        presentationMode: native

    - id: local-storage
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/local-storage'
      config:
        # 2026-08-29: 去掉 -m1 后缀，与 DSH_HOME (sessions + skill-realms) 统一在 ~/.dsh-edge-agent/ 下
        root: !!js (process.env.DSH_EDGE_STORAGE_ROOT ?? (process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent/storage')
        filename: storage.plain.jsonl
        enablePIIRedaction: true

    # NOTE: `sessions` and `audit-log` are NOT mounted — `dsh-session`
    # provides `sessions` upstream and nothing provides `auditLog` so
    # audit-log is mounted below under its own name.
    #
    # ── sessions provider ── dsh-base already mounts the same package
    # under id `session-persistence-jsonl` (root: `dshHomePath('sessions')`),
    # which exposes `sessionPersistence`. Previously we declared a second
    # mount under id `sessions` — that caused a duplicate `provide()` call
    # and a hard boot failure after the loader upgrade in @xmanrui/dsh-im
    # (commit b42c7db). Keep the upstream mount; our session-root env
    # override (`DSH_EDGE_SESSION_ROOT`) flows through `dshHomePath()`.

    - id: audit-log
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/audit-log'
      config:
        minLevel: !!js process.env.DSH_EDGE_AUDIT_MIN_LEVEL ?? 'info'
        ringBufferSize: 512
        flushIntervalMs: !!js parseInt(process.env.DSH_EDGE_AUDIT_FLUSH_MS ?? '1000', 10)
        filename: audit.plain.jsonl
        # 2026-08-29: 去掉 -m1 后缀，与 DSH_HOME 统一在 ~/.dsh-edge-agent/audit 下
        root: !!js (process.env.DSH_EDGE_AUDIT_ROOT ?? (process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent/audit')
        enablePIIRedaction: true
        maxFileSizeBytes: 10485760  # 10MB
        maxFileAgeDays: 7
        maxRotatedFiles: 5

    # ── A1 端侧隐私安全防护 ─────────────────────────────────────────────────
    - id: prompt-guard
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/prompt-guard'
      inject: [auditLog, llm]
      config:
        maxInputLength: 10000
        maxRequestsPerMinute: 20
        enablePIIRedaction: true
        enableInjectionDetection: true
        enableRateLimit: true
        enableModelDetection: !!js process.env.DSH_EDGE_GUARD_MODEL !== 'false'
        modelDetectionProvider: !!js process.env.DSH_EDGE_GUARD_MODEL_PROVIDER ?? 'local-qwen3-4b'
        modelDetectionModel: !!js process.env.DSH_EDGE_GUARD_MODEL_MODEL ?? 'Qwen3-4B-Instruct-2507'
        modelDetectionTimeoutMs: !!js parseInt(process.env.DSH_EDGE_GUARD_MODEL_TIMEOUT_MS ?? '4000', 10)
        modelDetectionMaxInputLength: !!js parseInt(process.env.DSH_EDGE_GUARD_MODEL_MAX_INPUT ?? '2000', 10)

    # ── Phase 4: 隐私策略引擎 + 脱敏管线 ──────────────────────────────────
    - id: privacy-policy
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/privacy-policy'
      inject: [auditLog]
      config:
        policyPath: !!js (process.env.DSH_EDGE_PRIVACY_POLICY_PATH ?? (process.cwd() + '/profiles/dsh-edge-agent/privacy-policy.json'))
        hotReload: true
        watchIntervalMs: 5000

    - id: sanitizer-pipeline
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/sanitizer-pipeline'
      inject: [privacyPolicy, auditLog]
      config:
        enableAutoDetection: true
        maxReplacementsPerSession: 1024
        # 明文 PII 映射表的生命周期兜底（2026-08-30）
        sessionTtlMs: !!js parseInt(process.env.DSH_EDGE_SAN_TTL_MS ?? '900000', 10)
        maxSessions: !!js parseInt(process.env.DSH_EDGE_SAN_MAX_SESSIONS ?? '1000', 10)
        sweepIntervalMs: !!js parseInt(process.env.DSH_EDGE_SAN_SWEEP_MS ?? '60000', 10)

    # ── Phase 5: web-search 监控守卫 ──────────────────────────────────────
    # Observes `tools/result` events for web_search / web_fetch. Tasks:
    #   - PII leak monitor (security-level audit when LLM bypasses sanitizer)
    #   - tool.web-search.executed audit event (info-level, redacted payload)
    #   - In-process sliding-window rate limit (web_search < 10/min,
    #     web_fetch < 5/min) — soft alarm today; M5+ wires ctx.tools.guard().
    - id: web-search-guard
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/web-search-guard'
      inject: [tools, sanitizer, auditLog]
      config:
        enablePIIMonitor: true
        enableAudit: true
        enableRateLimit: true

    # ── Phase 6: input-guard 编排器 ────────────────────────────────────
    # 端侧隐私安全管线的编排器。把安全/隐私/脱敏逻辑从 transport 层
    # (http-api) 上移到 Agent Loop 的事件链上 (agent/pre-step + llm/stream)，
    # 让所有入口（http-api / Web UI / CLI / SDK）自动统一走同一套管线。
    #
    # 组合调用：
    #   promptGuard.checkInput   (攻击检测)
    #   privacyPolicy.matchRouting (策略 REJECT)
    #   intentRouter.classify    (LOCAL/CLOUD 路由)
    #   sanitizer.sanitize       (仅 CLOUD：PII → 占位符)
    #   sanitizer.desanitize     (输出方向：占位符 → PII)
    #
    # 设计详见：docs/input-guard-design.md
    - id: input-guard
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/input-guard'
      inject: [promptGuard, privacyPolicy, intentRouter, sanitizer, auditLog]
      config:
        enableInputGuard: !!js process.env.DSH_EDGE_INPUT_GUARD !== 'false'
        sanitizeLocalTraffic: false
        # 攻击 / privacy-policy REJECT → 阻断 step（user 行为不端）
        rejectOnPolicyViolation: !!js process.env.DSH_EDGE_REJECT_POLICY !== 'false'
        # sanitize 失败 → 降级 LOCAL（系统故障而非 user 错；fail-closed + 可用）
