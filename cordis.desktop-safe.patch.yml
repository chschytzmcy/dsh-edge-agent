# dsh-edge-agent — desktop-safe overlay
#
# This patch is intended for loading the bundle into an existing DSH Desktop /
# Web profile through the Plugins page. Unlike the production `cordis.patch.yml`,
# it **only inserts** the edge privacy stack. It does not rewrite host defaults:
#
#   - no system-prompt/persona override
#   - no agent-default-model override
#   - no approval/sandbox override
#   - no session-root override
#   - no http-api listener
#   - no upstream tool/subagent/workflow disables
#
# What it does mount:
#   - durable ops log + audit log
#   - TCM stub + threat bus
#   - Realm-aware skill/tool bridge
#   - privacy policy + PII sanitizer
#   - prompt guard + intent router + input guard orchestrator
#   - §7.100 / §7.171 LLM routes: BOTH pools are DELEGATE adapters by default
#     (they forward to the host profile's own configured model provider — the
#     Desktop GUI's model picker — with host-side credential resolution; the
#     bundle never reads any secret). A pool becomes a DIRECT (edge-owned) one
#     only when its own endpoint is configured in config/edge.json
#     (llm.local.baseUrl / llm.cloud.baseUrl).
#
# Notes:
#   - §7.171 (2026-11-10) made llm.local symmetric with llm.cloud: with no
#     `llm.local.baseUrl` the local route still registers, but forwards to the
#     host provider. Consequence to be aware of: the internal LLM stages
#     (intent classification / guard model-detection) are pinned to
#     `local-llm`, so with no local endpoint they now run on the host's model
#     and the text under inspection rides along. The 2026-10-18 ruling
#     ("internal LLM calls must never borrow the host's cloud model") is
#     therefore honoured only when a local endpoint IS configured — or when
#     `llm.local.delegate=false`, which leaves the route unregistered and
#     sends the stages back to their keyword/regex tier.
#   - SANITIZED/CLOUD answers egress through the host's own provider — the
#     same destination plain Desktop use already picks — after PII
#     placeholder sanitization.
#   - LLM-based guard/intent detection config comes from config/edge.json
#     (stages.guard.* / stages.intent.*): both are ON by default, both point
#     at `local-llm`, and intent-router falls back to keyword/policy rules
#     when its classifier provider is unavailable.
#   - The privacy pipeline still intercepts every agent step. That is expected:
#     this is what makes it an edge-agent. If you want zero behavior change,
#     set DSH_EDGE_INPUT_GUARD=false before starting/restarting the profile.

- id: tool-web
  disabled: false
  config:
    search: true
    fetch: true
    searchMaxResults: 8
    searchTimeoutMs: 30000
    fetchTimeoutMs: 30000
- id: web
  config:
    searchProvider: tavily-bocha-fallback
    fetchProvider: http
- id: web-search-deepseek
  disabled: true

# ── 本 bundle 留在宿主树的三行（§7.136）──────────────────────────────────
# 理由见 scripts/_isolate-edge-group.mjs 的文件头：
#   dsh-edge-agent（裸包名）—— 宿主 client-modules 只扫宿主 Loader 的 entries，
#     preset 树不在其中 ⇒ Edge tab 的浏览器半边只能从这里被发现；
#   audit-log / file-logger —— 裸包名行 inject auditLog，且它的 installFileLogger
#     会先占住 fileLogger 服务名 ⇒ 两者必须在 root realm，且 file-logger 行要更早装载。
- insert:
    # §7.101.x (2026-10-20, fix #5) + §7.136: the BARE-package host-half row.
    # The webview client-module system (@deepseek-ai/dsh-client-modules) scans
    # LOADER ENTRY NAMES for a `dsh.client` declaration — and its package
    # locator only accepts bare package-root specifiers (`exactPackageSpecifier`),
    # so subpath rows like '@scope/pkg/audit-log' can never surface the
    # bundle's browser half. dsh-context shows the working shape: one bare
    # row (`name: dsh-context`) whose main entry IS the plugin AND whose
    # manifest carries `dsh.client.platform: "web"`.
    #
    # §7.136: this row must stay in the HOST tree. client-modules scans
    # `ctx.loader.entries()` — the host Loader's entries — while a preset's
    # plugin list lives in its own EntryTree, outside that enumeration. A bare
    # row inside the preset would therefore never surface the browser half and
    # the Edge tab would vanish in every work mode.
    - id: dsh-edge-agent
      name: '@dsh-edge/dsh-edge-agent'

    # Ops log exporter. Mount first so later plugin logs land on disk.
    - id: file-logger
      name: '@dsh-edge/dsh-edge-agent/file-logger'
      config:
        # §7.102 "one config file": only profile-specific statics live here.
        # root / level / rotation come from config/edge.json (audit.*);
        # no process.env reads — the desktop GUI never had them.
        filename: dsh-edge-agent-desktop.log
        flushIntervalMs: 1000
        queueCapacity: 10000
        maxFileSizeBytes: 52428800

    # Security ledger. Default root stays isolated under ~/.dsh-edge-agent.
    - id: audit-log
      name: '@dsh-edge/dsh-edge-agent/audit-log'
      config:
        # §7.102 "one config file": minLevel / flush / root come from
        # config/edge.json (audit.*). Only static wiring stays here.
        ringBufferSize: 512
        filename: audit.plain.jsonl
        enablePIIRedaction: true
        maxFileSizeBytes: 10485760
        maxFileAgeDays: 7
        maxRotatedFiles: 5

    # §7.145: 桌面版「起不来」的根因修复（431）。
    #
    # 这一行**必须**留在宿主树（不是 preset）—— 它修的不是 Edge 行为，而是
    # **宿主自己的启动**：Electron 外壳的 welcome 握手带着 Chromium cookie jar
    # 出发，cookie 越攒越多 ⇒ 请求头爆 16 KB ⇒ 431 ⇒ 外壳拆宿主 ⇒
    # 「DeepSeek Harness is unavailable」。握手发生在**任何工作方式选定之前**
    # ⇒ 修它的插件也必须在 preset 之外。
    #
    # 它自带 `process.versions.electron` 判据 ⇒ headless profile 里直接跳过。
    - id: desktop-cookie-janitor
      name: '@dsh-edge/dsh-edge-agent/desktop-cookie-janitor'
      config:
        enabled: true
        # 宿主 web 服务是裸 createServer（16 KB 头上限）；抬到 64 KB 让
        # 一个已经攒胖的 cookie jar 也不会打死启动。
        maxHeaderBytes: 65536

