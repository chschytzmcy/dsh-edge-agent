# dsh-edge-agent — desktop-safe overlay
#
# This patch is intended for loading the bundle into an existing DSH Desktop /
# Web profile through the Plugins page. Unlike the production `cordis.patch.yml`,
# it **only inserts** the edge privacy stack. It does not rewrite host defaults:
#
#   - no system-prompt/persona override
#   - no agent-default-model override
#   - no approval/sandbox override
#   - no session-root override
#   - no http-api listener
#   - no upstream tool/subagent/workflow disables
#
# What it does mount:
#   - durable ops log + audit log
#   - TCM stub + threat bus
#   - Realm-aware skill/tool bridge
#   - privacy policy + PII sanitizer
#   - prompt guard + intent router + input guard orchestrator
#   - §7.100 LLM routes: cloud-llm as a DELEGATE adapter (forwards to the
#     host profile's own configured model provider — the Desktop GUI's model
#     picker — with host-side credential resolution; the bundle never reads
#     any secret) + local-llm direct adapter (live only when the operator
#     exports DSH_EDGE_LOCAL_LLM_BASEURL).
#
# Notes:
#   - Only LOCAL_LLM_* is required for the full privacy experience. With no
#     local endpoint, intent classification / guard model-detection stay on
#     the keyword/regex tier by design (user ruling 2026-10-18: internal LLM
#     calls must never borrow the host's cloud model).
#   - SANITIZED/CLOUD answers egress through the host's own provider — the
#     same destination plain Desktop use already picks — after PII
#     placeholder sanitization.
#   - LLM-based guard/intent detection is intentionally conservative here.
#     Prompt-guard model detection is OFF by default (set
#     DSH_EDGE_GUARD_MODEL=true to opt in once a local endpoint exists);
#     intent-router falls back to keyword/policy rules when its classifier
#     provider is unavailable.
#   - The privacy pipeline still intercepts every agent step. That is expected:
#     this is what makes it an edge-agent. If you want zero behavior change,
#     set DSH_EDGE_INPUT_GUARD=false before starting/restarting the profile.

- id: tool-web
  disabled: false
  config:
    search: true
    fetch: true
    searchMaxResults: 8
    searchTimeoutMs: 30000
    fetchTimeoutMs: 30000
- id: web
  config:
    searchProvider: tavily-bocha-fallback
    fetchProvider: http
- id: web-search-deepseek
  disabled: true
