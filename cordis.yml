# dsh-edge-agent — edge-side private agent built on the DSH Cordis plugin
# mechanism. Run with: dsh --config cordis.yml
#
# Boot a session:
#   pnpm install
#   pnpm compile
#   DEEPSEEK_API_KEY=... pnpm dsh -- --profile edge-standard "你好"
#
# Layout:
#   1. User-interaction / approval seams (model-facing)
#   2. Core DSH services: sessions, agent-spine, llm, subagent, tools, fs
#   3. The dsh-edge-agent plugin tree (19 core + 1 http-api)
#   4. Sandbox + telemetry

# ─────────────────────────────────────────────────────────────────────────────
# 1. user-interaction / approval seams
# ─────────────────────────────────────────────────────────────────────────────

# User-interaction service: hosts `ctx.userQuestions`. dsh-edge-agent mounts
# the same DSH default provider that any other bundle would.
- id: user-questions
  name: '@deepseek-ai/dsh-user-questions'

# Approval waterfall. The edge-agent does NOT auto-approve by default;
# users opt into danger-full-access through DSH_EDGE_PERMISSION_MODE.
- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: !!js "process.platform === 'win32' ? 'never' : ((process.env.DSH_EDGE_PERMISSION_MODE ?? 'ask') === 'danger-full-access' ? 'never' : 'ask')"

# ─────────────────────────────────────────────────────────────────────────────
# 2. Core DSH services (sessions, agent, llm, subagent, tools, fs)
# ─────────────────────────────────────────────────────────────────────────────

# Durable session log (JSONL) — every session event is appended here so
# /resume, /compact, and the threat-detection bus can replay.
- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js (process.env.DSH_EDGE_SESSION_ROOT ?? (process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent/sessions')

- id: session-query
  name: '@deepseek-ai/dsh-session-query'

# Token accounting + manual /compact.
- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compact
  name: '@deepseek-ai/dsh-compaction-basic'

# Subagent registry, fork provider, and delegation tools.
- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-fork
  name: '@deepseek-ai/dsh-subagent-fork-in-process'
  config:
    providerName: fork

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: continuable
    maxDepth: 1

# Filesystem service + observation policy + model-facing fs tools.
- id: fs
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.cwd()

- id: fs-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

# Model-facing filesystem tools (read/write/edit/read_image)
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  config:
    readLimit: 2000
    readMaxBytes: 51200

# todo_write tool (mirrors the dsh-base bundle default).
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# Compaction basic — only one row; the dsh-edge-agent plugin tree is
# responsible for its own realm-aware tool registry (`tools`).

# ─────────────────────────────────────────────────────────────────────────────
# 3. dsh-edge-agent plugin tree
# ─────────────────────────────────────────────────────────────────────────────

# The main aggregator plugin: mounts every sub-plugin in boot order and
# registers the model-facing `services` namespace. The subpath exports
# pattern lets each row below be reused independently of this aggregator.
- id: dsh-edge-agent
  name: '@deepseek-harness-edge-agent/dsh-edge-agent'
  inject: [agents, llm, sessions, invariants]
  config:
    teeType: !!js process.env.DSH_EDGE_TEE_TYPE ?? 'simulated'
    storageRoot: !!js process.env.DSH_EDGE_STORAGE_ROOT ?? ((process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent')
    policyPath: !!js process.env.DSH_EDGE_POLICY_PATH ?? ((process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent/policy.json')
    defaultDataLevel: !!js process.env.DSH_EDGE_DEFAULT_DATA_LEVEL ?? 'sanitized'
    allowFallbackTls: !!js process.env.DSH_EDGE_ALLOW_FALLBACK_TLS === 'true'
    sessionWindowSize: !!js parseInt(process.env.DSH_EDGE_SESSION_WINDOW_SIZE ?? '32', 10)

# Trusted Computing Module — TEE-aware key management, encryption, sealing,
# and remote-attestation primitives. MUST mount first (every privacy/security
# plugin depends on its key store).
- id: tcm
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/tcm'
  config:
    teeType: !!js process.env.DSH_EDGE_TEE_TYPE ?? 'simulated'
    keyStorePath: !!js (process.env.DSH_EDGE_STORAGE_ROOT ?? ((process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent')) + '/keys'
    teeInference: !!js process.env.DSH_EDGE_TEE_INFERENCE === 'true'
    secureMemoryLimit: !!js parseInt(process.env.DSH_EDGE_SECURE_MEM ?? String(64 * 1024 * 1024), 10)

# Encrypted SQLite-backed key/value. Each value is AES-256-GCM encrypted via
# the TCM service before being written to disk.
- id: local-storage
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/local-storage'
  inject: [tcm]
  config:
    root: !!js (process.env.DSH_EDGE_STORAGE_ROOT ?? ((process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent')) + '/storage'
    filename: !!js process.env.DSH_EDGE_STORAGE_FILE ?? 'storage.enc.db'

# Encrypted session lifecycle.
- id: sessions-edge
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/sessions'
  inject: [tcm, localStorage]
  config:
    defaultTtlSeconds: !!js parseInt(process.env.DSH_EDGE_SESSION_TTL ?? String(60 * 60), 10)
    maxConcurrentSessions: !!js parseInt(process.env.DSH_EDGE_MAX_SESSIONS ?? '8', 10)

# Tamper-evident audit log. HMAC-chained so any tampering is detected.
- id: audit-log
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/audit-log'
  inject: [tcm, localStorage]
  config:
    minLevel: !!js process.env.DSH_EDGE_AUDIT_LEVEL ?? 'info'
    sensitiveFields: !!js (process.env.DSH_EDGE_AUDIT_SENSITIVE_FIELDS ?? '').split(',').filter(Boolean)
    enableAlerts: !!js process.env.DSH_EDGE_AUDIT_ALERTS !== 'false'
    alertThresholds:
      cloudRequestsPerMinute: !!js parseInt(process.env.DSH_EDGE_AUDIT_CLOUD_RATE ?? '20', 10)
      sanitizationFailures: !!js parseInt(process.env.DSH_EDGE_AUDIT_SAN_FAIL ?? '3', 10)
      permissionDenied: !!js parseInt(process.env.DSH_EDGE_AUDIT_PERM_DENIED ?? '5', 10)
    flushIntervalMs: !!js parseInt(process.env.DSH_EDGE_AUDIT_FLUSH_MS ?? '500', 10)

# Hot-reloadable privacy policy engine.
- id: privacy-policy
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/privacy-policy'
  inject: [tcm, localStorage, auditLog]
  config:
    policyPath: !!js process.env.DSH_EDGE_POLICY_PATH ?? ((process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent/policy.json')
    hotReload: !!js process.env.DSH_EDGE_POLICY_HOT_RELOAD !== 'false'
    watchIntervalMs: !!js parseInt(process.env.DSH_EDGE_POLICY_WATCH_MS ?? '5000', 10)

# Realm-aware tool registry (LOCAL / CLOUD / SANITIZED).
- id: tools
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/tools'
  inject: [auditLog]
  config:
    defaultRateLimitPerMinute: !!js parseInt(process.env.DSH_EDGE_TOOL_RATE ?? '60', 10)
    enableToolIsolation: !!js process.env.DSH_EDGE_TOOL_ISOLATION !== 'false'

# Realm-aware skill + tool isolation bridge. Reads skill-realms.json to tag
# every discovered skill/tool as LOCAL | CLOUD | hidden, then enforces the
# mapping at agent/pre-step (catalog filtering) and tools/pre-execute (deny
# cross-realm calls). Hot-reloads the config file without restart.
- id: realm-skill-bridge
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/realm-skill-bridge'
  inject: [auditLog]
  config:
    configPath: !!js process.env.DSH_EDGE_REALM_CONFIG ?? ((process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent/skill-realms.json')
    hotReload: !!js process.env.DSH_EDGE_REALM_HOT_RELOAD !== 'false'
    watchIntervalMs: !!js parseInt(process.env.DSH_EDGE_REALM_WATCH_MS ?? '5000', 10)

# Input/output safety scanning. MVP: checkInput only with 4 default rules.
- id: prompt-guard
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/prompt-guard'
  inject: [tcm, privacyPolicy, auditLog, llm]
  config:
    rules: []
    enableModelDetection: !!js process.env.DSH_EDGE_GUARD_MODEL !== 'false'
    modelDetectionProvider: !!js process.env.DSH_EDGE_GUARD_MODEL_PROVIDER ?? 'local-llm'
    modelDetectionModel: !!js process.env.DSH_EDGE_GUARD_MODEL_MODEL ?? 'qwen3-4b'
    modelDetectionTimeoutMs: !!js parseInt(process.env.DSH_EDGE_GUARD_MODEL_TIMEOUT_MS ?? '4000', 10)
    modelDetectionMaxInputLength: !!js parseInt(process.env.DSH_EDGE_GUARD_MODEL_MAX_INPUT ?? '2000', 10)

# Intent classification → routing decision.
- id: intent-router
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/intent-router'
  inject: [llm, promptGuard, privacyPolicy, auditLog, sessions, localStorage]
  config:
    confidenceThreshold: !!js parseFloat(process.env.DSH_EDGE_INTENT_CONFIDENCE_THRESHOLD ?? '0.6')
    llmTimeoutMs: !!js parseInt(process.env.DSH_EDGE_INTENT_LLM_TIMEOUT_MS ?? '4000', 10)
    recentMessagesLimit: !!js parseInt(process.env.DSH_EDGE_INTENT_RECENT_LIMIT ?? '3', 10)
    maxInputLength: !!js parseInt(process.env.DSH_EDGE_INTENT_MAX_INPUT ?? '2000', 10)
    fallbackKeywords: !!js (process.env.DSH_EDGE_INTENT_FALLBACK_KEYWORDS ?? '').split(',').filter(Boolean)

# Model router — single `llm` surface, routes to local/cloud adapters.
- id: model-router
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/model-router'
  inject: [llm, privacyPolicy, auditLog]
  config:
    defaultModel: !!js process.env.DSH_EDGE_DEFAULT_MODEL ?? 'local-llm'
    localModels: !!js (process.env.DSH_EDGE_LOCAL_MODELS ?? 'local-llm,local-llm-llama3').split(',').filter(Boolean)
    cloudModels: !!js (process.env.DSH_EDGE_CLOUD_MODELS ?? 'cloud-llm,cloud-llm-v3').split(',').filter(Boolean)

# Local LLM adapter (OpenAI-compatible endpoint).
#
# NOTE: Pre-fix (2026-09-11), this row passed `modelPath` / `contextSize` /
# `threads` which are NOT in the plugin's Schema — Schemastery silently dropped
# them. Meanwhile `baseUrl` / `defaultModel` / `apiKeyEnv` were never wired,
# so .env.sh's DSH_EDGE_LOCAL_LLM_BASEURL etc. never reached the adapter.
# Rewritten to match `Schema.object({providers, baseUrl, defaultModel, apiKeyEnv})`
# in src/dsh-adapter/local-llm-adapter.ts.
#
# `apiKeyEnv` lets the adapter read a bearer from any env var (e.g. for
# cloud-hosted OpenAI-compatible endpoints like DashScope, OpenRouter, etc).
# Leave undefined to skip the Authorization header (plain llama.cpp server).
- id: local-llm-adapter
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/local-llm-adapter'
  config:
    providers: !!js (process.env.DSH_EDGE_LOCAL_MODELS ?? 'local-llm').split(',').filter(Boolean)
    baseUrl: !!js process.env.DSH_EDGE_LOCAL_LLM_BASEURL ?? 'http://127.0.0.1:8080/v1'
    defaultModel: !!js process.env.DSH_EDGE_LOCAL_LLM_MODEL ?? 'qwen3-4b'
    apiKeyEnv: !!js process.env.DSH_EDGE_LOCAL_LLM_APIKEY_ENV ?? undefined

# Cloud LLM adapter (DeepSeek / other providers). Routes through secure-bridge.
- id: cloud-llm-adapter
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/cloud-llm-adapter'
  inject: [secureBridge, auditLog]
  config:
    providers: !!js (process.env.DSH_EDGE_CLOUD_MODELS ?? 'cloud-llm').split(',').filter(Boolean)
    baseUrl: !!js process.env.DEEPSEEK_BASE_URL ?? 'https://api.deepseek.com'
    apiKeyEnv: !!js process.env.DSH_EDGE_CLOUD_KEY_ENV ?? 'DEEPSEEK_API_KEY'

# Forward / reverse PII sanitization (SANITIZED realm).
- id: sanitizer-pipeline
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/sanitizer-pipeline'
  inject: [localStorage, privacyPolicy]
  config:
    enableAutoDetection: !!js process.env.DSH_EDGE_SAN_AUTO !== 'false'
    maxReplacementsPerSession: !!js parseInt(process.env.DSH_EDGE_SAN_MAX ?? '1024', 10)
    # 会话映射表持有明文 PII，必须有生命周期上限。http-api 删会话时会主动
    # purge；以下两项是防止调用方漏调的兜底（2026-08-30）。
    sessionTtlMs: !!js parseInt(process.env.DSH_EDGE_SAN_TTL_MS ?? '900000', 10)
    maxSessions: !!js parseInt(process.env.DSH_EDGE_SAN_MAX_SESSIONS ?? '1000', 10)
    sweepIntervalMs: !!js parseInt(process.env.DSH_EDGE_SAN_SWEEP_MS ?? '60000', 10)

# Phase 5 web-search monitoring guard: observes `tools/result` events for
# web_search / web_fetch, emits audit entries, PII-leak detection, rate-limit.
- id: web-search-guard
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/web-search-guard'
  inject: [tools, sanitizer, auditLog]
  config:
    enablePIIMonitor: !!js process.env.DSH_EDGE_WSG_PII !== 'false'
    enableAudit: !!js process.env.DSH_EDGE_WSG_AUDIT !== 'false'
    enableRateLimit: !!js process.env.DSH_EDGE_WSG_RATE !== 'false'

# OHTTP gateway (RFC 9458) — HPKE ciphertext to a relay that cannot link
# user identity to request content.
- id: ohttp-gateway
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/ohttp-gateway'
  inject: [tcm, auditLog]
  config:
    relayUrl: !!js process.env.DSH_EDGE_OHTTP_RELAY ?? ''
    targetUrl: !!js process.env.DSH_EDGE_OHTTP_TARGET ?? ''
    publicKey: !!js process.env.DSH_EDGE_OHTTP_PUBKEY ?? ''
    keyId: !!js process.env.DSH_EDGE_OHTTP_KEY_ID ?? ''
    allowFallbackTls: !!js process.env.DSH_EDGE_ALLOW_FALLBACK_TLS === 'true'

# Outbound channel for cloud-bound requests.
- id: secure-bridge
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/secure-bridge'
  inject: [tcm, ohttp, privacyPolicy, auditLog]
  config:
    mode: !!js process.env.DSH_EDGE_BRIDGE_MODE ?? 'ohttp'
    domainAllowList: !!js (process.env.DSH_EDGE_BRIDGE_ALLOW ?? '').split(',').filter(Boolean)
    domainDenyList: !!js (process.env.DSH_EDGE_BRIDGE_DENY ?? '').split(',').filter(Boolean)
    requestTimeoutMs: !!js parseInt(process.env.DSH_EDGE_BRIDGE_TIMEOUT_MS ?? '30000', 10)

# TEE attestation token generation + verification.
- id: attestation
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/attestation'
  inject: [tcm, auditLog]
  config:
    verifierUrl: !!js process.env.DSH_EDGE_ATTEST_VERIFIER ?? undefined
    nonceTtlSeconds: !!js parseInt(process.env.DSH_EDGE_ATTEST_NONCE_TTL ?? '60', 10)

# Threat detection bus. Subscribes to high-volume events and raises a
# quarantine action when patterns indicate abuse. Phase D: real state
# machine; http-api reads getThreatLevel() and blocks at blockLevel.
- id: td-bus
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/td-bus'
  inject: [auditLog, privacyPolicy]
  config:
    windowSeconds: !!js parseInt(process.env.DSH_EDGE_TD_WINDOW ?? '60', 10)
    thresholds:
      cloudRequestsPerMinute: !!js parseInt(process.env.DSH_EDGE_TD_CLOUD_RATE ?? '20', 10)
      failedSanitizationStreak: !!js parseInt(process.env.DSH_EDGE_TD_SAN ?? '3', 10)
      permissionDeniedStreak: !!js parseInt(process.env.DSH_EDGE_TD_PERM ?? '5', 10)
    blockLevel: !!js process.env.DSH_EDGE_TD_BLOCK_LEVEL ?? 'critical'

# Voice input (Whisper-tiny). MVP off by default.
- id: voice-input
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/voice-input'
  inject: [sessions, auditLog]
  config:
    modelPath: !!js process.env.DSH_EDGE_VOICE_MODEL ?? ((process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent/models/whisper-tiny.bin')
    vadSilenceThreshold: !!js parseFloat(process.env.DSH_EDGE_VOICE_VAD ?? '0.6')
    sampleRate: !!js parseInt(process.env.DSH_EDGE_VOICE_SR ?? '16000', 10)

# Plugin-interop anchor (Community Consensus v0.15 unified grant store,
# runtime generation id, Host Descriptor). Mounted ahead of any third-party
# plugin row.
- id: plugin-host
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/plugin-host'
  inject: [agents, sessions]
  config:
    enableThirdParty: !!js process.env.DSH_EDGE_PLUGINS_THIRD_PARTY === 'true'
    grantStorePath: !!js (process.env.DSH_EDGE_STORAGE_ROOT ?? ((process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent')) + '/grants.json'

# ─────────────────────────────────────────────────────────────────────────────
# 4. Sandbox + telemetry
# ─────────────────────────────────────────────────────────────────────────────

# Sandbox confinement. The edge agent defaults to workspace-write; cloud
# requests are gated by secure-bridge, not the sandbox.
- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    mode: !!js "process.platform === 'win32' ? 'danger-full-access' : (process.env.DSH_EDGE_PERMISSION_MODE ?? 'workspace-write')"
    workspaceRoot: !!js process.cwd()

# Subprocess + bash capability. Edge agent uses a tighter timeout than the
# default coding agent (60s vs the dsh-base 10min) because edge sessions are
# shorter-lived.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  config:
    cwd: !!js process.cwd()
    timeoutMs: !!js parseInt(process.env.DSH_EDGE_BASH_TIMEOUT_MS ?? '60000', 10)

# Model-facing bash tool
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  config:
    enableRunInBackground: false

# Model-facing web tools (web_search + web_fetch)
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    search: true
    fetch: true
    searchMaxResults: 8
    fetchTimeoutMs: 30000
    searchTimeoutMs: 30000

# DeepSeek web search provider (Anthropic-compatible API)
- id: web-search-deepseek
  name: '@deepseek-ai/dsh-web-search-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: https://api.deepseek.com/anthropic/v1
    model: deepseek-v4-flash

# Telemetry (DSH built-in).
- id: telemetry
  name: '@deepseek-ai/dsh-telemetry'
  config:
    enabled: !!js process.env.DSH_EDGE_TELEMETRY === 'true'