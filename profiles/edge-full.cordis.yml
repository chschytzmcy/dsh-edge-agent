# edge-full — maximum coverage profile. All 19 plugins + http-api enabled.
# Use for: demos, end-to-end testing, security research.
#
# Run: dsh --config profiles/edge-full.cordis.yml

- id: user-questions
  name: '@deepseek-ai/dsh-user-questions'

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: !!js "process.platform === 'win32' ? 'never' : ((process.env.DSH_EDGE_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask')"

# All base services (sessions, agent, llm, subagent, fs, etc.) inherited from cordis.yml.
# Add every dsh-edge-agent sub-plugin here so they all run in parallel.

- id: tcm
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/tcm'
  config:
    teeType: !!js process.env.DSH_EDGE_TEE_TYPE ?? 'simulated'
    keyStorePath: !!js (process.env.DSH_EDGE_STORAGE_ROOT ?? (process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent-full') + '/keys'
    teeInference: !!js process.env.DSH_EDGE_TEE_INFERENCE === 'true'
    secureMemoryLimit: !!js parseInt(process.env.DSH_EDGE_SECURE_MEM ?? String(128 * 1024 * 1024), 10)

- id: local-storage
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/local-storage'
  inject: [tcm]
  config:
    root: !!js (process.env.DSH_EDGE_STORAGE_ROOT ?? (process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent-full') + '/storage'
    filename: storage.enc.db

- id: sessions-edge
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/sessions'
  inject: [tcm, localStorage]
  config:
    defaultTtlSeconds: 7200
    maxConcurrentSessions: 16

- id: audit-log
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/audit-log'
  inject: [tcm, localStorage]
  config:
    minLevel: debug
    enableAlerts: true
    flushIntervalMs: 250

- id: privacy-policy
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/privacy-policy'
  inject: [tcm, localStorage, auditLog]
  config:
    policyPath: !!js process.env.DSH_EDGE_POLICY_PATH ?? ((process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent-full/policy.json')
    hotReload: true
    watchIntervalMs: 2000

- id: tools
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/tools'
  inject: [auditLog]
  config:
    defaultRateLimitPerMinute: 120
    enableToolIsolation: true

- id: prompt-guard
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/prompt-guard'
  inject: [tcm, privacyPolicy, auditLog]
  config:
    rules: []
    enableModelDetection: true

- id: intent-router
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/intent-router'
  inject: [llm, promptGuard, privacyPolicy, auditLog, sessions, localStorage]
  config:
    enableLlmFallback: true
    ruleConfidenceThreshold: 0.5

- id: model-router
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/model-router'
  inject: [llm, privacyPolicy, auditLog]
  config:
    defaultModel: local-qwen3-4b
    localModels: [local-qwen3-4b, local-llama3-8b]
    cloudModels: [cloud-deepseek-v4, cloud-deepseek-v3]

- id: local-llm-adapter
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/local-llm-adapter'
  config:
    providers: [local-qwen3-4b, local-llama3-8b]
    modelPath: !!js (process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent-full/models/qwen3-4b.gguf'
    contextSize: 16384
    threads: 8

- id: cloud-llm-adapter
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/cloud-llm-adapter'
  inject: [secureBridge, auditLog]
  config:
    providers: [cloud-deepseek-v4, cloud-deepseek-v3]
    baseUrl: !!js process.env.DEEPSEEK_BASE_URL ?? 'https://api.deepseek.com'
    apiKeyEnv: !!js process.env.DSH_EDGE_CLOUD_KEY_ENV ?? 'DEEPSEEK_API_KEY'

- id: sanitizer-pipeline
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/sanitizer-pipeline'
  inject: [localStorage, privacyPolicy]
  config:
    enableAutoDetection: true
    maxReplacementsPerSession: 4096

- id: ohttp-gateway
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/ohttp-gateway'
  inject: [tcm, auditLog]
  config:
    relayUrl: !!js process.env.DSH_EDGE_OHTTP_RELAY ?? ''
    targetUrl: !!js process.env.DSH_EDGE_OHTTP_TARGET ?? ''
    publicKey: !!js process.env.DSH_EDGE_OHTTP_PUBKEY ?? ''
    keyId: !!js process.env.DSH_EDGE_OHTTP_KEY_ID ?? ''
    allowFallbackTls: true

- id: secure-bridge
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/secure-bridge'
  inject: [tcm, ohttp, privacyPolicy, auditLog]
  config:
    mode: ohttp
    requestTimeoutMs: 60000

- id: attestation
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/attestation'
  inject: [tcm, auditLog]
  config:
    verifierUrl: !!js process.env.DSH_EDGE_ATTEST_VERIFIER ?? undefined
    nonceTtlSeconds: 60

- id: td-bus
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/td-bus'
  inject: [auditLog, privacyPolicy]
  config:
    windowSeconds: 60
    thresholds:
      cloudRequestsPerMinute: 30
      failedSanitizationStreak: 5
      permissionDeniedStreak: 10

- id: local-tools
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/local-tools'
  inject: [tools, localStorage]
  config:
    readOnly: false
    maxFileSize: 52428800

- id: web-search
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/web-search'
  inject: [tools, secureBridge, auditLog]
  config:
    backend: brave
    maxResultsPerQuery: 16

- id: voice-input
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/voice-input'
  inject: [sessions, auditLog]
  config:
    modelPath: !!js (process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent-full/models/whisper-tiny.bin'
    vadSilenceThreshold: 0.5
    sampleRate: 16000

- id: plugin-host
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/plugin-host'
  inject: [agents, sessions]
  config:
    enableThirdParty: false
    grantStorePath: !!js (process.env.DSH_EDGE_STORAGE_ROOT ?? (process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent-full') + '/grants.json'

- id: http-api
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/http-api'
  inject: [agents, sessions, auditLog]
  config:
    host: 127.0.0.1
    port: 21017
    requireAttestation: true

- id: dsh-edge-agent
  name: '@deepseek-harness-edge-agent/dsh-edge-agent'
  inject: [agents, llm, sessions, invariants]
  config:
    teeType: !!js process.env.DSH_EDGE_TEE_TYPE ?? 'simulated'
    storageRoot: !!js process.env.DSH_EDGE_STORAGE_ROOT ?? ((process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent-full')
    policyPath: !!js process.env.DSH_EDGE_POLICY_PATH ?? ((process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent-full/policy.json')
    defaultDataLevel: !!js process.env.DSH_EDGE_DEFAULT_DATA_LEVEL ?? 'sanitized'
    allowFallbackTls: true
    sessionWindowSize: 64