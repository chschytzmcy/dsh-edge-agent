# edge-minimal — minimal local-only profile. No cloud, no OHTTP.
# Use for: tests, smoke checks, resource-constrained devices.
#
# Run: dsh --config profiles/edge-minimal.cordis.yml

- id: user-questions
  name: '@deepseek-ai/dsh-user-questions'

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: !!js "process.platform === 'win32' ? 'never' : ((process.env.DSH_EDGE_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask')"

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js (process.env.DSH_EDGE_SESSION_ROOT ?? (process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent-minimal/sessions')

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: fs
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.cwd()

- id: tcm
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/tcm'
  config:
    teeType: simulated
    keyStorePath: !!js (process.env.DSH_EDGE_STORAGE_ROOT ?? (process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent-minimal') + '/keys'
    teeInference: false
    secureMemoryLimit: 33554432

- id: local-storage
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/local-storage'
  inject: [tcm]
  config:
    root: !!js (process.env.DSH_EDGE_STORAGE_ROOT ?? (process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent-minimal') + '/storage'
    filename: storage.enc.db

- id: sessions-edge
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/sessions'
  inject: [tcm, localStorage]
  config:
    defaultTtlSeconds: 1800
    maxConcurrentSessions: 2

- id: audit-log
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/audit-log'
  inject: [tcm, localStorage]
  config:
    minLevel: warn
    enableAlerts: false
    flushIntervalMs: 1000

- id: local-llm-adapter
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/local-llm-adapter'
  config:
    providers: [local-qwen3-4b]
    modelPath: !!js (process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent-minimal/models/qwen3-4b.gguf'
    contextSize: 4096
    threads: 2

- id: dsh-edge-agent
  name: '@deepseek-harness-edge-agent/dsh-edge-agent'
  inject: [agents, llm, sessions, invariants]
  config:
    teeType: simulated
    storageRoot: !!js (process.env.DSH_EDGE_STORAGE_ROOT ?? (process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent-minimal')
    policyPath: !!js (process.env.DSH_EDGE_STORAGE_ROOT ?? (process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent-minimal') + '/policy.json'
    defaultDataLevel: public
    allowFallbackTls: false
    sessionWindowSize: 16