# Custom M4 overlay: disable the upstream DeepSeek adapter (we own the
# cloud provider route) and mount the edge-agent subpath plugins that
# are not already provided by dsh-base / dsh-headless.
#
# Rows dsh-base already owns: settings, credentials, llm, subprocess,
# sandbox, user-questions, approval, permission, tools, token-meter,
# system-prompt, agent-loop, fs-sandbox, llm-pi-ai, llm-deepseek.
# Rows dsh-headless adds: code-runtime, headless-startup, headless-runner,
# plus its system-prompt / hmr overrides.
#
# This overlay therefore only adds NEW ids (or rewrites existing rows).
#
# It also disables upstream bundle rows that are stubbed in this repo
# (http-api, dsh-edge-agent aggregator, ohttp-gateway, web-search,
# voice-input, secure-bridge, attestation, td-bus, sanitizer-pipeline,
# plugin-host, dsh-edge-agent) because their apply() functions crash on
# boot — they are M5+ work, not M4. Re-enable one at a time as the
# corresponding code lands.

# ── upstream-disabled rows ──────────────────────────────────────────────────────
- id: llm-deepseek
  disabled: true
  # edge-agent owns the CLOUD provider route; the future A4 (OHTTP)
  # stage will swap the wire transport under cloud-llm-adapter.

- id: dsh-edge-agent
  disabled: true
  # Aggregator; M4 is a single-purpose headless driver, so the
  # aggregator stays disabled.

- id: plugin-host
  disabled: true
- id: ohttp-gateway
  disabled: true
- id: secure-bridge
  disabled: true
- id: attestation
  disabled: true
- id: web-search
  disabled: true
- id: voice-input
  disabled: true

# Force the agent loop to a provider that edge-agent registered. The
# default in dsh-base is `deepseek-official`, which we just disabled.
- id: agent-default-model
  config:
    provider: !!js process.env.DSH_EDGE_PROVIDER ?? 'cloud-deepseek-v4'
    model: !!js process.env.DSH_EDGE_MODEL ?? 'deepseek-chat'

# Persona override: edge-agent (M4, multi-model). The persona is kept
# provider-agnostic so DeepSeek (CLOUD) is not constrained by local-tool
# mentions. LOCAL-realm tools are registered separately via local-tools
# plugin and appear in the tool list, not in the persona text.
- id: system-prompt
  config:
    persona: !!js (process.env.DSH_EDGE_PERSONA ?? 'You are edge-agent, a privacy-first AI assistant running on the user\'s edge device. Answer in the user\'s language. Be concise and helpful. You have access to local tools for file operations and calculations when appropriate. For knowledge questions, current events, or complex reasoning, provide comprehensive answers. Use the tool registry (bash, read, write, edit, glob, grep, todo_write, web_search, web_fetch, skill, send_message, interrupt_agent, subagent_fork, local_file_read, local_file_write, local_calculate) when an action is required; call the matching tool with the correct parameter shape and never invent tool names. The `skill` tool loads detailed instructions for a named capability (e.g. lark-doc, lark-calendar); once you call skill({name}) and receive its content, use that content immediately to answer the user\'s question — do NOT call the same skill again.')

# ── new plugin inserts ─────────────────────────────────────────────────────────

# ── dsh-base tools stripped to keep the real-LLM context small ─────────────
# The bundled dsh-base patch mounts many tool rows that contribute large
# system-prompt sections. The qwen3-4b endpoint caps at 13 000 input
# tokens; for the M4 smoke we only need file_read / file_write /
# calculate (the LOCAL-realm tools mounted by `local-tools`). Every
# row below stays on disk so an M5+ profile can re-enable them.

# 启用的工具（测试用）
- id: tool-bash
- id: tool-fs
- id: tool-fs-search
- id: tool-web
  config:
    search: true
    fetch: true
    searchMaxResults: 8
    searchTimeoutMs: 30000
    fetchTimeoutMs: 30000
- id: web
- id: dsh-web
- id: tool-todo
- id: tool-str-replace-editor
- id: web-search-deepseek
  # Provides the DeepSeek-backed search provider for `ctx.web.search()`.
  # Shares $DEEPSEEK_API_KEY with cloud-llm-adapter; hits the Anthropic-
  # compatible endpoint (api.deepseek.com/anthropic/v1) using the native
  # web_search_20250305 server tool, not the chat-completions base.

# 禁用的工具
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-skill
  # Enabled: CLOUD agents need the `skill` tool to load lark-* SKILL.md content.
  # realm-skill-bridge filters the catalog so each agent only sees its realm's skills.
  disabled: false
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent-report
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-goal
  disabled: true
- id: skill-filesystem
  # Enabled: auto-discovers skills from ~/.agents/skills/ (lark-* etc.)
  # realm-skill-bridge tags and filters them by realm.
  disabled: false
- id: skill-badge
  disabled: true
- id: subagent
  disabled: true
- id: subagent-spawn-in-process
  disabled: true
- id: subagent-fork-in-process
  disabled: true
- id: workflow-worker-thread
  disabled: true
- id: goal
  disabled: true
- id: goal-round-driver
  disabled: true
- id: command-goal
  disabled: true
- id: session-title-llm
  disabled: true
- id: session-telemetry-otel
  disabled: true
- id: repeat-tool-reminder
  disabled: true
- id: spill-local
  disabled: true
- id: spill-policy
  disabled: true
- id: session-checkpoint-policy
  disabled: true
- id: tool-result-pruner
  disabled: true
- id: tool-call-timeout-policy
  disabled: true
- id: compaction-basic
  disabled: true
- id: command-compact
  disabled: true
- insert:
    # tcm: prompt-guard injects this; must mount first
    - id: tcm
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/tcm'
      config:
        teeType: !!js process.env.DSH_EDGE_TEE_TYPE ?? 'simulated'
        keyStorePath: !!js (process.env.DSH_EDGE_STORAGE_ROOT ?? (process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent') + '/tcm-keys.json'

    # td-bus: http-api injects this; must mount before http-api
    - id: td-bus
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/td-bus'
      inject: [auditLog, privacyPolicy]
      config:
        quarantineAction: log
        patternWindowMs: 60000
        patternThreshold: 8

    # realm-skill-bridge: realm-aware skill catalog filtering + tool gating.
    # Must mount before http-api (which injects realmSkillBridge).
    - id: realm-skill-bridge
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/realm-skill-bridge'
      inject: [auditLog]
      config:
        configPath: !!js process.env.DSH_EDGE_REALM_CONFIG ?? ((process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent/skill-realms.json')
        hotReload: !!js process.env.DSH_EDGE_REALM_HOT_RELOAD !== 'false'
        watchIntervalMs: !!js parseInt(process.env.DSH_EDGE_REALM_WATCH_MS ?? '5000', 10)

    - id: http-api
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/http-api'
      inject: [agents, intentRouter, promptGuard, auditLog, sanitizer, realmSkillBridge, edgeTools]
      config:
        host: !!js process.env.DSH_EDGE_HTTP_HOST ?? '127.0.0.1'
        port: !!js parseInt(process.env.DSH_EDGE_HTTP_PORT ?? '21017', 10)
        bearerToken: !!js process.env.EDGE_API_KEY ?? undefined
        requireAttestation: false
        sessionIdleTimeoutMs: 1800000  # 30 min
        maxActiveSessions: 100

    - id: cloud-llm-adapter
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/cloud-llm-adapter'
      inject: [llm, auditLog]
      config:
        providers: [cloud-deepseek-v4]
        baseUrl: !!js process.env.DEEPSEEK_BASE_URL ?? 'https://api.deepseek.com'
        apiKeyEnv: DEEPSEEK_API_KEY
        defaultModel: !!js process.env.DSH_EDGE_MODEL ?? 'deepseek-chat'

    - id: local-llm-adapter
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/local-llm-adapter'
      inject: [llm, auditLog]
      config:
        providers: [local-qwen3-4b]
        baseUrl: !!js process.env.DSH_EDGE_LOCAL_LLM_BASEURL ?? 'http://192.168.1.121:11017/v1'
        defaultModel: !!js process.env.DSH_EDGE_LOCAL_LLM_MODEL ?? 'Qwen3-4B-Instruct-2507'
        apiKeyEnv: !!js process.env.DSH_EDGE_LOCAL_LLM_KEY_ENV ?? undefined

    - id: model-router
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/model-router'
      inject: [llm]
      config:
        defaultModel: !!js process.env.DSH_EDGE_MODEL_ROUTER_DEFAULT ?? 'cloud-deepseek-v4'
        localModels: [local-qwen3-4b]
        cloudModels: [cloud-deepseek-v4]

    - id: intent-router
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/intent-router'
      inject: [llm, auditLog]
      config:
        defaultCategory: CLOUD
        classificationProvider: !!js process.env.DSH_EDGE_INTENT_PROVIDER ?? 'local-qwen3-4b'
        classificationModel: !!js process.env.DSH_EDGE_INTENT_MODEL ?? 'Qwen3-4B-Instruct-2507'
        confidenceThreshold: !!js parseFloat(process.env.DSH_EDGE_INTENT_CONFIDENCE_THRESHOLD ?? '0.6')
        llmTimeoutMs: !!js parseInt(process.env.DSH_EDGE_INTENT_LLM_TIMEOUT_MS ?? '4000', 10)
        recentMessagesLimit: !!js parseInt(process.env.DSH_EDGE_INTENT_RECENT_LIMIT ?? '3', 10)
        maxInputLength: !!js parseInt(process.env.DSH_EDGE_INTENT_MAX_INPUT ?? '2000', 10)
        fallbackKeywords: !!js (process.env.DSH_EDGE_INTENT_FALLBACK_KEYWORDS ?? '').split(',').filter(Boolean)

    # NOTE: id renamed from `tools` to avoid colliding with dsh-base.
    - id: edge-tools-registry
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/tools'
      inject: [auditLog, tools]
      config:
        defaultRateLimitPerMinute: 60
        enableToolIsolation: true
        presentationMode: native

    - id: local-storage
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/local-storage'
      config:
        root: !!js (process.env.DSH_EDGE_STORAGE_ROOT ?? (process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent-m1/storage')
        filename: storage.plain.jsonl
        enablePIIRedaction: true

    # NOTE: `sessions` and `audit-log` are NOT mounted — `dsh-session`
    # provides `sessions` upstream and nothing provides `auditLog` so
    # audit-log is mounted below under its own name.
    - id: audit-log
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/audit-log'
      config:
        minLevel: !!js process.env.DSH_EDGE_AUDIT_MIN_LEVEL ?? 'info'
        ringBufferSize: 512
        flushIntervalMs: !!js parseInt(process.env.DSH_EDGE_AUDIT_FLUSH_MS ?? '1000', 10)
        filename: audit.plain.jsonl
        root: !!js (process.env.DSH_EDGE_AUDIT_ROOT ?? (process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent-m1/audit')
        enablePIIRedaction: true
        maxFileSizeBytes: 10485760  # 10MB
        maxFileAgeDays: 7
        maxRotatedFiles: 5

    # ── A1 端侧隐私安全防护 ─────────────────────────────────────────────────
    - id: prompt-guard
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/prompt-guard'
      inject: [auditLog, llm]
      config:
        maxInputLength: 10000
        maxRequestsPerMinute: 20
        enablePIIRedaction: true
        enableInjectionDetection: true
        enableRateLimit: true
        enableModelDetection: !!js process.env.DSH_EDGE_GUARD_MODEL !== 'false'
        modelDetectionProvider: !!js process.env.DSH_EDGE_GUARD_MODEL_PROVIDER ?? 'local-qwen3-4b'
        modelDetectionModel: !!js process.env.DSH_EDGE_GUARD_MODEL_MODEL ?? 'Qwen3-4B-Instruct-2507'
        modelDetectionTimeoutMs: !!js parseInt(process.env.DSH_EDGE_GUARD_MODEL_TIMEOUT_MS ?? '4000', 10)
        modelDetectionMaxInputLength: !!js parseInt(process.env.DSH_EDGE_GUARD_MODEL_MAX_INPUT ?? '2000', 10)

    # ── Phase 4: 隐私策略引擎 + 脱敏管线 ──────────────────────────────────
    - id: privacy-policy
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/privacy-policy'
      inject: [auditLog]
      config:
        policyPath: !!js (process.env.DSH_EDGE_PRIVACY_POLICY_PATH ?? (process.cwd() + '/profiles/dsh-edge-agent/privacy-policy.json'))
        hotReload: true
        watchIntervalMs: 5000

    - id: sanitizer-pipeline
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/sanitizer-pipeline'
      inject: [privacyPolicy, auditLog]
      config:
        enableAutoDetection: true
        maxReplacementsPerSession: 1024

    # ── Phase 5: web-search 监控守卫 ──────────────────────────────────────
    # Observes `tools/result` events for web_search / web_fetch. Tasks:
    #   - PII leak monitor (security-level audit when LLM bypasses sanitizer)
    #   - tool.web-search.executed audit event (info-level, redacted payload)
    #   - In-process sliding-window rate limit (web_search < 10/min,
    #     web_fetch < 5/min) — soft alarm today; M5+ wires ctx.tools.guard().
    - id: web-search-guard
      name: '@deepseek-harness-edge-agent/dsh-edge-agent/web-search-guard'
      inject: [tools, sanitizer, auditLog]
      config:
        enablePIIMonitor: true
        enableAudit: true
        enableRateLimit: true

