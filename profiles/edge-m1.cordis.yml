# edge-m1 — M4 profile: multi-model + routing. Run:
#
#   pnpm dsh --config profiles/edge-m1.cordis.yml "你好"
#   pnpm dsh --config profiles/edge-m1.cordis.yml --provider local-qwen3-4b-mock "你好"
#   DSH_EDGE_LOCAL_LLM_MODE=real DSH_EDGE_LOCAL_LLM_BASEURL=http://192.168.66.195:8701/v1 \
#     pnpm dsh --config profiles/edge-m1.cordis.yml --provider local-qwen3-4b "你好"
#
# Requires `DEEPSEEK_API_KEY` in the launching environment. Override the
# base URL with `DEEPSEEK_BASE_URL` (default `https://api.deepseek.com`).
# Set `DSH_EDGE_LOCAL_LLM_MODE` to `real` to route `local-qwen3-4b` to
# the LAN endpoint named by `DSH_EDGE_LOCAL_LLM_BASEURL` (default
# `http://127.0.0.1:8080/v1`).
#
# This profile exercises the M4 contract from § 8.6 of
# dsh-edge-agent-design-v6.md: a single shared `ctx.llm` runtime mounts
# two adapters (cloud-llm-adapter, local-llm-adapter) and the
# model-router resolves the per-request provider.

# User-settings document: hot-reloads overrides from `$DSH_HOME/settings.yaml`.
- id: settings
  name: '@deepseek-ai/dsh-settings-file'

# Credential store: resolves `DEEPSEEK_API_KEY` at request time.
- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

# Upstream DeepSeek adapter is intentionally NOT mounted. edge-agent's
# own cloud-llm-adapter owns the cloud provider route so a future A4
# (OHTTP) stage can swap the wire transport without touching upstream.
- id: cloud-llm-adapter
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/cloud-llm-adapter'
  config:
    providers: [cloud-deepseek-v4]
    baseUrl: !!js process.env.DEEPSEEK_BASE_URL ?? 'https://api.deepseek.com'
    apiKeyEnv: DEEPSEEK_API_KEY
    defaultModel: deepseek-chat

# M4: local LLM adapter — owns the `local-qwen3-4b` provider route
# (real OpenAI-compatible `/chat/completions`). No in-process mock;
# every call leaves the process.
- id: local-llm-adapter
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/local-llm-adapter'
  inject: [llm]
  config:
    providers: [local-qwen3-4b]
    baseUrl: !!js process.env.DSH_EDGE_LOCAL_LLM_BASEURL ?? 'http://127.0.0.1:8080/v1'
    defaultModel: !!js process.env.DSH_EDGE_LOCAL_LLM_MODEL ?? 'qwen3-4b'
    apiKeyEnv: !!js process.env.DSH_EDGE_LOCAL_LLM_KEY_ENV ?? undefined

- id: model-router
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/model-router'
  inject: [llm]
  config:
    defaultModel: cloud-deepseek-v4
    localModels: [local-qwen3-4b]
    cloudModels: [cloud-deepseek-v4]

- id: intent-router
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/intent-router'
  config:
    defaultCategory: CLOUD

# Realm-aware tool registry (thin view over `ctx.tools`); M2 keeps
# `enableToolIsolation=true` so the A2 intent-router can filter the
# visible tool set per run.
- id: tools
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/tools'
  inject: [auditLog]
  config:
    defaultRateLimitPerMinute: 60
    enableToolIsolation: true
    presentationMode: native

# M2 local bundle: three LOCAL-realm tools (file_read / file_write /
# calculate) registered against `ctx.tools`. `readOnly=true` keeps
# file_write disabled for the M2 minimum.
- id: local-tools
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/local-tools'
  inject: [edgeTools]
  config:
    allowList: !!js (process.env.DSH_EDGE_LOCAL_TOOLS_ALLOWLIST ?? '/tmp').split(',').map((s) => s.trim()).filter(Boolean)
    readOnly: !!js process.env.DSH_EDGE_LOCAL_TOOLS_WRITABLE !== 'true'
    maxFileSize: 1048576
    timeoutMs: 10000

# Standard upstream services needed for an agent loop to run a one-shot task.
- id: user-questions
  name: '@deepseek-ai/dsh-user-questions'

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: !!js "process.platform === 'win32' ? 'never' : ((process.env.DSH_EDGE_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask')"

# M3 plaintext storage + audit chain (A3 swaps these for TCM-encrypted).
# local-storage backs sessions + audit-log + future realm-tagged stores.
- id: local-storage
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/local-storage'
  config:
    root: !!js (process.env.DSH_EDGE_STORAGE_ROOT ?? (process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent-m1/storage')
    filename: storage.plain.jsonl

# Session store built on top of local-storage. Plaintext, full-blob-per-key.
- id: sessions
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/sessions'
  inject: [localStorage]
  config:
    defaultTtlSeconds: !!js parseInt(process.env.DSH_EDGE_SESSION_TTL ?? '3600', 10)
    maxConcurrentSessions: !!js parseInt(process.env.DSH_EDGE_SESSION_MAX ?? '64', 10)
    collection: sessions

# Audit log: ring buffer + periodic flush to plaintext JSONL.
- id: audit-log
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/audit-log'
  config:
    minLevel: !!js process.env.DSH_EDGE_AUDIT_MIN_LEVEL ?? 'info'
    ringBufferSize: 512
    flushIntervalMs: !!js parseInt(process.env.DSH_EDGE_AUDIT_FLUSH_MS ?? '1000', 10)
    filename: audit.plain.jsonl
    root: !!js (process.env.DSH_EDGE_AUDIT_ROOT ?? (process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent-m1/audit')

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: fs
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.cwd()

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents:
      - id: main
        provider: !!js process.env.DSH_EDGE_PROVIDER ?? 'cloud-deepseek-v4'
        model: !!js process.env.DSH_EDGE_MODEL ?? 'deepseek-chat'
        cwd: !!js process.cwd()
    persona: |
      You are edge-agent (M4, multi-model with LOCAL-realm tools). Answer in
      the user's language. Be brief. When the user asks you to read or
      compute against a local file, call the matching `local_*` tool with
      its declared parameter shape; do not invent file contents. The
      available local tools are: `local_file_read`, `local_file_write`
      (when enabled), and `local_calculate`. Do not assume a network tool,
      a shell, or sandboxing beyond what the tool schemas declare.

      The active LLM provider is whatever `DSH_EDGE_PROVIDER` selects:
        - `cloud-deepseek-v4` (default) — DeepSeek Chat Completions, requires
          `DEEPSEEK_API_KEY`.
        - `local-qwen3-4b-mock` — in-process echo, no network.
        - `local-qwen3-4b`     — LAN endpoint at `DSH_EDGE_LOCAL_LLM_BASEURL`
          (default `http://127.0.0.1:8080/v1`); turn it on with
          `DSH_EDGE_LOCAL_LLM_MODE=real`.
      Stay within whichever model the user picked; do not switch providers
      mid-conversation.

# Subprocess group required by any tool-using agent loop. M2 registers
# LOCAL-realm tools (file_read / file_write / calculate) against
# `ctx.tools`; the upstream dsh-agent loop dispatches them in-process, so
# the subprocess group is still required for future shell-based tools.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'
