# edge-m1 — M1 minimal profile: cloud DeepSeek only, no security, no
# local LLM, no persistence. Run:
#
#   pnpm dsh --config profiles/edge-m1.cordis.yml "你好"
#
# Requires `DEEPSEEK_API_KEY` in the launching environment. Override the
# base URL with `DEEPSEEK_BASE_URL` (default `https://api.deepseek.com`).
#
# This profile deliberately exercises the M1 contract from § 8.3 of
# dsh-edge-agent-design-v6.md: only the three new dsh-edge-agent plugins
# (cloud-llm-adapter, model-router, intent-router) plus the upstream
# services needed to register an adapter and drive an agent loop.

# User-settings document: hot-reloads overrides from `$DSH_HOME/settings.yaml`.
- id: settings
  name: '@deepseek-ai/dsh-settings-file'

# Credential store: resolves `DEEPSEEK_API_KEY` at request time.
- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

# Upstream DeepSeek adapter is intentionally NOT mounted. edge-agent's
# own cloud-llm-adapter owns the cloud provider route so a future A4
# (OHTTP) stage can swap the wire transport without touching upstream.
- id: cloud-llm-adapter
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/cloud-llm-adapter'
  config:
    providers: [cloud-deepseek-v4]
    baseUrl: !!js process.env.DEEPSEEK_BASE_URL ?? 'https://api.deepseek.com'
    apiKeyEnv: DEEPSEEK_API_KEY
    defaultModel: deepseek-chat

- id: model-router
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/model-router'
  inject: [llm]
  config:
    defaultModel: cloud-deepseek-v4
    localModels: [local-qwen3-4b-mock]
    cloudModels: [cloud-deepseek-v4]

- id: intent-router
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/intent-router'
  config:
    defaultCategory: CLOUD

# Realm-aware tool registry (thin view over `ctx.tools`); M2 keeps
# `enableToolIsolation=true` so the A2 intent-router can filter the
# visible tool set per run.
- id: tools
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/tools'
  inject: [auditLog]
  config:
    defaultRateLimitPerMinute: 60
    enableToolIsolation: true
    presentationMode: native

# M2 local bundle: three LOCAL-realm tools (file_read / file_write /
# calculate) registered against `ctx.tools`. `readOnly=true` keeps
# file_write disabled for the M2 minimum.
- id: local-tools
  name: '@deepseek-harness-edge-agent/dsh-edge-agent/local-tools'
  inject: [edgeTools]
  config:
    allowList: !!js (process.env.DSH_EDGE_LOCAL_TOOLS_ALLOWLIST ?? '/tmp').split(',').map((s) => s.trim()).filter(Boolean)
    readOnly: !!js process.env.DSH_EDGE_LOCAL_TOOLS_WRITABLE !== 'true'
    maxFileSize: 1048576
    timeoutMs: 10000

# Standard upstream services needed for an agent loop to run a one-shot task.
- id: user-questions
  name: '@deepseek-ai/dsh-user-questions'

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: !!js "process.platform === 'win32' ? 'never' : ((process.env.DSH_EDGE_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask')"

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js (process.env.DSH_EDGE_SESSION_ROOT ?? (process.env.USERPROFILE ?? process.env.HOME) + '/.dsh-edge-agent-m1/sessions')

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: fs
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.cwd()

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents:
      - id: main
        provider: cloud-deepseek-v4
        model: deepseek-chat
        cwd: !!js process.cwd()
    persona: |
      You are edge-agent (M2, cloud LLM with LOCAL-realm tools). Answer in
      the user's language. Be brief. When the user asks you to read or
      compute against a local file, call the matching `local_*` tool with
      its declared parameter shape; do not invent file contents. The
      available local tools are: `local_file_read`, `local_file_write`
      (when enabled), and `local_calculate`. Do not assume a network tool,
      a shell, or sandboxing beyond what the tool schemas declare.

# Subprocess group required by any tool-using agent loop. M2 registers
# LOCAL-realm tools (file_read / file_write / calculate) against
# `ctx.tools`; the upstream dsh-agent loop dispatches them in-process, so
# the subprocess group is still required for future shell-based tools.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'