packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false
allowBuilds:
  # 2026-09-02: when dsh-edge-agent is added as a bundle to a webui-based
  # profile (e.g. `dsh plugin --profile web add -w $LOCAL_PKG`)，the
  # transitive deps may pull node-pty (linux-x64 prebuild blocker).
  # §7.43 (2026-09-05): 默认 host = dsh-tui；这条仍适用于 web (--with-web)。
  # See PROGRESS §7.25 + §7.43.
  node-pty: true
  # 2026-09-02: cloudflared / cpu-features / ssh2 already required by
  # the dsh-tui and dsh-edge-agent profiles (e.g. dsh-tui's pnpm-workspace
  # already lists these). Promote them here so anyone installing this
  # bundle standalone (without a pre-existing profile overlay) gets the
  # same allow-list.
  cloudflared: true
  cpu-features: true
  ssh2: true
  # §7.101: client bundle 的 esbuild postinstall(本机 darwin-arm64 原生二进制)。
  esbuild: true
onlyBuiltDependencies:
  - esbuild
