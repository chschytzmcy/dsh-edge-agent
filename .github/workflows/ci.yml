# dsh-edge-agent CI — six stages: build → verify → unit → e2e-privacy → e2e-opslog → smoke.
#
# Triggered on every push to master and every PR. The full sequence is:
#   1. install (pnpm install --frozen-lockfile)
#   2. compile (tsc -p tsconfig.json → lib/types/)
#   3. verify  (verify:build = boundary + contract + patch-surface + plugin-spec + package)
#   4. unit    (vitest unit tests; asserts exact count via JSON reporter)
#   5. e2e-privacy (bash scripts/e2e-privacy-precheck.sh; spins up real dsh server,
#                  runs 19 注入 / 业务 / 路由 用例, must report 19/19 PASS)
#   6. e2e-opslog  (bash scripts/e2e-ops-log-coverage.sh; §7.46.9 回归,
#                  21 节点 ops log 覆盖 + 3 重点用例（mibao/news/local-ip）断言)
#   7. smoke   (smoke.ts 冒烟)
#
# 任一阶段失败 → PR block。Gate 总数：
#   - 单元测试：必须 629 PASS（含 1 跳过）、0 FAIL（实际 628 用例 + 1 跳过）
#   - 隐私 E2E：必须 19/19 PASS（9 注入 → 400 + 5 业务 → 403 + 5 路由 → 200）
#   - ops log 覆盖：必须 3/3 用例通过（mibao + news + local-ip）+ 21 节点全绿

name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build & verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile
        run: pnpm run compile

      - name: Verify (boundary / contract / patch-surface / plugin-spec / package)
        run: pnpm run verify:build

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lib
          path: lib/
          retention-days: 7

  test:
    name: unit tests (628/628)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile
        run: pnpm run compile

      - name: Run unit tests (JSON reporter for count assertion)
        run: pnpm test -- --run --reporter=json --outputFile=/tmp/vitest.json || true

      - name: Assert test count
        run: |
          set -e
          TOTAL=$(node -e "const r=require('/tmp/vitest.json'); console.log(r.numTotalTests)")
          PASSED=$(node -e "const r=require('/tmp/vitest.json'); console.log(r.numPassedTests)")
          FAILED=$(node -e "const r=require('/tmp/vitest.json'); console.log(r.numFailedTests)")
          SKIPPED=$(node -e "const r=require('/tmp/vitest.json'); console.log(r.numSkippedTests)")
          echo "Total: $TOTAL, Passed: $PASSED, Failed: $FAILED, Skipped: $SKIPPED"
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::单元测试有 $FAILED 个 FAIL——PR block。"
            exit 1
          fi
          if [ "$TOTAL" -lt 600 ]; then
            echo "::error::测试总数 ($TOTAL) 远低于 628 基线——可能漏跑了部分用例，PR block。"
            exit 1
          fi

      - name: Run smoke test
        run: pnpm run smoke

  e2e-privacy:
    name: privacy e2e (19/19)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile
        run: pnpm run compile

      - name: Install DSH CLI
        run: npm install -g @deepseek-ai/dsh
        # dsh CLI 启动时读取 ~/.dsh/profiles/<name>/cordis.yml + bundles 列表，
        # 缺 bundle 注册会回到 vanilla 配置跑（缺少 dsh-edge-agent 全部 plugins）。
        # §7.43 (2026-09-11): CI bootstrap 切到 dsh-tui（mandatory primary）。
        # web profile 通过后续步骤 bootstrap（同 dsh-tui，独立步骤）。

      - name: Bootstrap DSH dsh-tui profile
        run: |
          # §7.43 (2026-09-11): dsh-tui 是 mandatory primary。CI 先建 dsh-tui
          # profile + 注册 dsh-edge-agent bundle + 同步 cordis.patch.yml，
          # 确保 19 个 plugins 加载。
          mkdir -p "$HOME/.dsh/profiles/dsh-tui"
          dsh plugin --profile dsh-tui add @deepseek-harness-edge-agent/dsh-edge-agent || true
          NESTED="$HOME/.dsh/profiles/dsh-tui/node_modules/@deepseek-harness-edge-agent/dsh-edge-agent"
          mkdir -p "$NESTED"
          cp cordis.patch.yml "$NESTED/cordis.patch.yml"
          cp cordis.yml "$NESTED/cordis.yml" 2>/dev/null || true
          echo "已同步 bundle patch → $NESTED/cordis.patch.yml"

      - name: Bootstrap DSH web profile (web-only e2e)
        run: |
          # §7.43: install.sh --profiles=dsh-tui,web 并存；web-only e2e
          # (e2e-privacy-precheck.sh 等) 需要 web profile。bootstrap 同 dsh-tui，best-effort。
          mkdir -p "$HOME/.dsh/profiles/web"
          dsh plugin --profile web add @deepseek-harness-edge-agent/dsh-edge-agent || true
          NESTED="$HOME/.dsh/profiles/web/node_modules/@deepseek-harness-edge-agent/dsh-edge-agent"
          mkdir -p "$NESTED"
          cp cordis.patch.yml "$NESTED/cordis.patch.yml"
          echo "已同步 bundle patch → $NESTED/cordis.patch.yml"

      - name: Run privacy precheck e2e (must report 19/19)
        env:
          EDGE_API_KEY: test-secret-key
          DSH_EDGE_HTTP_PORT: '21017'
        run: bash scripts/e2e-privacy-precheck.sh

  e2e-opslog:
    name: ops log coverage (3 cases)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    # §7.46.9: 21 节点 ops log 覆盖 + 3 重点用例（mibao/news/local-ip）回归。
    # 复用 e2e-privacy 的 web profile bootstrap（步骤相同）。
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile
        run: pnpm run compile

      - name: Install DSH CLI
        run: npm install -g @deepseek-ai/dsh

      - name: Bootstrap DSH web profile (含 dsh-edge-agent bundle)
        run: |
          mkdir -p "$HOME/.dsh/profiles/web"
          dsh plugin --profile web add @deepseek-harness-edge-agent/dsh-edge-agent || true
          NESTED="$HOME/.dsh/profiles/web/node_modules/@deepseek-harness-edge-agent/dsh-edge-agent"
          mkdir -p "$NESTED"
          cp cordis.patch.yml "$NESTED/cordis.patch.yml"
          echo "已同步 bundle patch → $NESTED/cordis.patch.yml"

      - name: Trim web profile duplicate @deepseek-ai/* (§7.46.8)
        run: |
          # §7.46.8（2026-09-12）— web profile preset scope fix。
          # 删除 install.sh 自动加的 15 个重复 @deepseek-ai/*，避免 Symbol('dsh.scope') 双实例。
          bash scripts/fix-profile-duplicates.sh --profile=web

      - name: Start dsh web profile (background)
        env:
          EDGE_API_KEY: test-secret-key
          DEEPSEEK_API_KEY: test-fake-deepseek-key-for-opslog-fixture
          DSH_EDGE_HTTP_PORT: '21017'
        run: |
          cd "$HOME/.dsh/profiles/web"
          nohup dsh --profile web > /tmp/dsh-web.log 2>&1 &
          echo $! > /tmp/dsh-web.pid
          # 等待端口就绪
          for i in $(seq 1 30); do
            if curl -s --max-time 2 http://127.0.0.1:21017/health > /dev/null 2>&1; then
              echo "web profile ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run ops log coverage regression (3 重点用例)
        env:
          EDGE_API_KEY: test-secret-key
          DEEPSEEK_API_KEY: test-fake-deepseek-key-for-opslog-fixture
          DSH_EDGE_HTTP_PORT: '21017'
        run: bash scripts/e2e-ops-log-coverage.sh

      - name: Upload ops log for debugging
        if: always()
        run: |
          echo "=== last 50 lines of dsh-web.log ==="
          tail -50 /tmp/dsh-web.log || true
          echo "=== canary log slices ==="
          for sid in opslog-canary-mibao opslog-canary-news opslog-canary-local-ip; do
            echo "--- $sid ---"
            grep "$sid" ~/.dsh-edge-agent/log/dsh-edge-agent.log 2>/dev/null || echo "(no log)"
          done