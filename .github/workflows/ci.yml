# dsh-edge-agent CI — three stages: build → unit → web-profile-smoke.
#
# Triggered on every push to main and every PR. The full sequence is:
#   1. install (pnpm install --frozen-lockfile)
#   2. build   (compile → typecheck:client → build:client → build:installable;
#               §7.154 —— the gates verify ARTIFACTS, so all four steps are
#               required; compile alone leaves lib/client.js and
#               dist/installable/ missing and CI reads ENOENT)
#   3. verify  (verify:build = boundary + contract + patch-surface +
#               patch-row-shape + plugin-spec + env-bridge + bundle-mount +
#               installable + installable-edge + host-mount + client-mount +
#               desktop-auth-cookies + session-audit + package + doc-links +
#               ci-build-chain)
#   4. unit    (vitest unit tests; asserts exact count via JSON reporter)
#   5. coverage (vitest --coverage; per-directory thresholds in
#               vitest.config.ts — §7.123)
#   6. web-profile-smoke (§7.221: 在干净的 runner 上装 bundle、起真实的宿主
#              profile、确认 http-api 拿到 bearer 正常起服 —— 见下面那个 job)
#
# §7.86(2026-09-18): 删除 e2e-privacy / e2e-tui-live / smoke 三个阶段 —— 前两个
# 依赖历史 edge-m1 / dsh-tui rig(已废除);smoke.ts 引到 M5+ work 还没写的
# local-tools.js(ERR_MODULE_NOT_FOUND)。
#
# §7.221 (2026-11-13): **ops log 覆盖回归不再是 CI 阶段**。它需要一把真的模型
# 凭据（`DEEPSEEK_API_KEY` 给宿主当模型 key 用），而主人裁定这个 secret 不用
# ⇒ 那条回归**退休**，脚本 `scripts/e2e-ops-log-coverage.sh` 降级为**本地手动**
# 跑（`make e2e-coverage`，需要本机 `config/edge.json` / `.env` 里的真 key）。
# ⇒ 留下的是「bundle 装得上 + profile 起得来」的冒烟（不碰任何凭据）。
#
# 任一阶段失败 → PR block。Gate 总数：
#   - 单元测试：必须 0 FAIL；低于 600 视为漏跑（CI 防漏跑阈值）
#   - 覆盖率：src/dsh-adapter/ 目录级行/函数/分支下限（vitest.config.ts）
#   - web profile 冒烟：bundle 装得上 + profile 起得来 + http-api 拿到 bearer
#   - （ops log 覆盖：§7.221 起**不在 CI 里** —— 本地手动跑）

# §7.196 (2026-11-12): 本文件此前**一次都没绿过** —— 145 次 ci run（自 run #51 /
# 2026-10-26 起）全部 failure，失败点恒为「Setup Node.js」，后面所有步全 skipped。
#
# 根因：**setup-node 与 pnpm/action-setup 的顺序反了**。
#   setup-node 的 `cache: 'pnpm'` 会去执行 `pnpm --version` 定位 store 路径，
#   而 pnpm/action-setup 当时排在它**后面** ⇒ pnpm 还不存在 ⇒ 该步直接失败：
#   「Unable to locate executable file: pnpm」（runner 报错原文）。
#
# 连带后果（当时没人看见，因为红得太早）：
#   - ci.yml 的 4 个 job 全废 ⇒ 单测 / 覆盖率 / ops log 覆盖在 CI 上从没跑过；
#   - publish.yml 的 publish job 同样卡在这一步 ⇒ 从没跑到 `pnpm publish`
#     ⇒ **trusted publishing 那条链一次都没被验证过**；
#   - release job 被 needs 依赖跳过 ⇒ GitHub Release 也没建过。
#
# 修法：pnpm/action-setup 提到 setup-node **之前**（pnpm 官方推荐顺序），
# 并把 action 升到 node24 版本（setup-node@v7 / checkout@v7 /
# pnpm/action-setup@v6 / upload-artifact@v7）—— 旧的 @v4 目标是 Node 20，
# GitHub 已强制用 Node 24 跑它们并在报弃用警告。
#
# §7.199 (2026-11-12): 单测步的**参数转发**是个陷阱 —— `pnpm test -- --reporter=json
# --outputFile=…` 在 runner 上**没把这两个参数交给 vitest**：pnpm 把**字面 `--`**
# 透传给了脚本，vitest 的 CLI 解析器（cac）把 `--` 之后的一切当成**位置过滤器**
# ⇒ `--reporter=json` / `--outputFile=…` 被静默丢弃 ⇒ 跑的是默认 reporter、
# 报告文件没生成、**退出码还是 0**（run #153 实况：82 个文件全跑、1629 条测试、
# exit=0，但 /tmp/vitest.json 不存在 ⇒ 计数门禁无从判定）。
#
# 本机复现（可重复）：`node node_modules/vitest/vitest.mjs run tests/unit --
# --reporter=json --outputFile=X` ⇒ 默认 reporter、exit=0、报告文件不生成，
# 与 runner 症状逐条一致。
#
# 修法：参数**烤进 package.json 的 `test:ci` 脚本**（`--reporter=json
# --outputFile=dist/probe/vitest-ci.json`），workflow 只调 `pnpm run test:ci`
# —— 全程不出现 `--`，彻底不依赖 pnpm 的 `--` 转发语义（哪个 pnpm 版本都成立）。
# 报告路径也改成**仓库内相对路径**（dist/ 已 gitignore），不再依赖 /tmp。
# scripts/verify-ci-build-chain.mjs 现在会挡住「用 `--` 转发 vitest 参数」这个写法。

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build & verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm 必须先于 setup-node 装好（原因见文件头 §7.196）
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # §7.154 (2026-10-29): the gates verify ARTIFACTS, not sources.
      #
      # `compile` alone is NOT enough. `compile` = clean-lib + tsc, and
      # clean-lib wipes lib/ ENTIRELY — tsc only rebuilds the server half.
      # The other two artifacts the gates read come from two SEPARATE steps:
      #
      #   lib/client.js          ← build:client     (esbuild, browser half)
      #   dist/installable/…     ← build:installable (the shipped bundle)
      #
      # verify:client-mount hard-reads lib/client.js and verify:installable /
      # verify:installable-edge read dist/installable/ ⇒ CI hit ENOENT and
      # every push to main has been RED since §7.106 (2026-10-20).
      #
      # This chain must stay identical to package.json#scripts.build
      # ("compile typecheck:client build:client build:installable pack:tarball verify:build").
      # The order matters: build:installable refuses to ship a bundle whose
      # exports["./client"] does not resolve (§7.145) ⇒ build:client first.
      #
      # §7.158: pack:tarball is in the chain because verify:build now also
      # audits dist/*.tar.gz (verify:tarball, §7.157). Without the artifacts
      # the gate reads ENOENT-ish failures and the job goes red — the same
      # shape §7.154 fixed for lib/client.js and dist/installable/.
      #
      # scripts/verify-ci-build-chain.mjs gates this file — without it, a
      # dropped step here is invisible until CI goes red again.
      - name: Build (compile → browser half → installable bundle → tarballs → npm stage)
        run: node scripts/run.mjs compile typecheck:client build:client build:installable pack:tarball stage:npm

      - name: Verify (boundary / contract / patch-surface / plugin-spec / package)
        run: pnpm run verify:build

      - name: Lint (eslint, error-level gate)
        run: pnpm run lint

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: lib
          path: lib/
          retention-days: 7

  test:
    name: unit tests (vitest suite, §7.199)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm 必须先于 setup-node 装好（原因见文件头 §7.196）
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile
        run: pnpm run compile

      # §7.199: 这条命令**不能**写成 `pnpm test -- --reporter=json …` ——
      # 实测 run #153：某些 pnpm 版本会把**字面 `--`** 传给脚本，vitest 的 CLI
      # 解析器（cac）把 `--` 之后的一切当作**位置过滤器** ⇒ `--reporter=json` /
      # `--outputFile=…` 被静默丢弃 ⇒ 跑的是默认 reporter、报告文件不生成、
      # **退出码仍是 0**（"看起来绿了"，其实计数门禁根本没判）。
      # ⇒ 参数**烤进 package.json 的 `test:ci` 脚本**里，workflow 只调脚本名，
      #    彻底不依赖 pnpm 的 `--` 转发语义。
      - name: Run unit tests (JSON reporter for count assertion)
        run: |
          VITEST_EXIT=0
          pnpm run test:ci > /tmp/vitest.out 2> /tmp/vitest.err || VITEST_EXIT=$?
          echo "vitest exit=${VITEST_EXIT}"
          # §7.199: 工具链版本记成**注解** —— 注解是公开可读的（匿名也能取），
          # 而 runner 的 log 要登录才看得到 ⇒ 版本差异只能靠这条注解留痕。
          # （本节根因就是「runner 上的 pnpm 与本机行为不一致」，版本必须留证。）
          echo "::notice::toolchain — node $(node --version), pnpm $(pnpm --version)"
          # §7.198: 报告没写出来 ⇒ 计数门禁无从判定 ⇒ 这一步直接红，并把
          # **现场**写进注解 —— 注解是公开可读的，不必登录看 log。
          # §7.199: 诊断的**顺序**改了 —— GitHub 会截断过长的注解（实测
          # run #153 的注解在 /tmp 清单处被砍掉，工具版本根本没进去）⇒
          # 最重要的几行放最前面：工具版本 → 实际执行的命令行 → 退出码 → 尾部。
          if [ ! -f dist/probe/vitest-ci.json ]; then
            {
              echo "node $(node --version) | pnpm $(pnpm --version)"
              echo "vitest exit=${VITEST_EXIT}"
              echo "--- command echo (stdout head) ---"
              head -3 /tmp/vitest.out 2>/dev/null || echo "(no stdout)"
              echo "--- stdout tail ---"
              tail -8 /tmp/vitest.out 2>/dev/null || echo "(no stdout)"
              echo "--- stderr tail ---"
              tail -8 /tmp/vitest.err 2>/dev/null || echo "(no stderr)"
            } > /tmp/vitest.diag 2>&1 || true
            # ⚠️ GitHub 的 workflow command 是**单行**的：注解消息里出现换行，
            # 那一行之后的全部内容就变成普通日志、**不进注解**。⇒ 整段诊断要
            # 编码成一行（%0A = 换行，%25 = 字面 %）。
            # 用 awk 而不是 tr/sed：tr 只能把换行换成一个字符（换成 `%`），
            # 而 GNU sed 4.9 在「先 %25 再 N 循环」的组合下会把 %25 吞掉
            # （本机 Git Bash 4.9 实测）⇒ 只有 awk 这条往返是对的。
            DIAG=$(awk 'BEGIN{ORS=""} {gsub(/%/,"%25"); printf "%s%%0A", $0}' /tmp/vitest.diag 2>/dev/null)
            echo "::error::vitest 没有写出 dist/probe/vitest-ci.json —— 计数门禁无法判定%0A${DIAG}"
            exit 1
          fi

      - name: Assert test count
        run: |
          set -e
          REPORT=dist/probe/vitest-ci.json
          TOTAL=$(node -e "const r=require('./${REPORT}'); console.log(r.numTotalTests)")
          PASSED=$(node -e "const r=require('./${REPORT}'); console.log(r.numPassedTests)")
          FAILED=$(node -e "const r=require('./${REPORT}'); console.log(r.numFailedTests)")
          SKIPPED=$(node -e "const r=require('./${REPORT}'); console.log(r.numPendingTests ?? 0)")
          echo "Total: $TOTAL, Passed: $PASSED, Failed: $FAILED, Skipped: $SKIPPED"
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::单元测试有 $FAILED 个 FAIL——PR block。"
            exit 1
          fi
          if [ "$TOTAL" -lt 600 ]; then
            echo "::error::测试总数 ($TOTAL) 远低于 600 基线——可能漏跑了部分用例，PR block。"
            exit 1
          fi

      # §7.123 (2026-10-27): real coverage gate.
      #
      # The count floor above only proves that *some* tests ran — adding 600
      # empty `it()` calls satisfied it, and three test files asserted
      # against RE-IMPLEMENTATIONS of the production code (so they could
      # not fail on a regression). The thresholds live in
      # vitest.config.ts → test.coverage.thresholds and are per-directory
      # floors pinned at the measured level: a new uncovered module, or a
      # refactor that drops exercised lines, now fails CI.
      - name: Coverage gate (per-directory thresholds)
        run: pnpm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # §7.103 (2026-10-21) 曾记录 Windows 上 build 跑不完（门禁依赖 bash）并
  # 为此改造过门禁 —— 但没有 windows CI job 防回归，下次退化和 §7.104/§7.106
  # （都在 Windows 桌面部署上炸过）一样只能装机后才发现。本 job 只跑
  # compile + 单测：verify:build / web-profile-smoke 阶段含 bash 脚本，仍 Linux-only。
  test-windows:
    name: unit tests (windows)
    runs-on: windows-latest
    timeout-minutes: 15
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm 必须先于 setup-node 装好（原因见文件头 §7.196）
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile
        run: pnpm run compile

      - name: Run unit tests
        run: pnpm test

  web-profile-smoke:
    name: web profile smoke (bundle mounts + boots)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    # §7.46.9: 这个 job 原来是「21 节点 ops log 覆盖 + 3 重点用例（mibao/news/
    # local-ip）回归」。
    # §7.86(2026-09-18): web profile bootstrap —— dsh-edge bundle 注册 + cordis.patch.yml 同步。
    #
    # §7.221 (2026-11-13): **ops log 覆盖回归从这个 job 里退休**。它需要一把
    # 真的模型凭据（`DEEPSEEK_API_KEY` 给宿主当模型 key：runner 上没有登录
    # 账号、DELEGATE 没有转发目标），而主人裁定这个 secret 不用 ⇒ 那四个用例
    # 在 runner 上永远跑不通 ⇒ 留着就是一段**永远 skipped 的死代码** + 一条
    # 永远为假的门禁（仓库里那个 secret 本来就**没配过**：Actions secrets
    # 列表 total_count = 0，实测 2026-11-13）。
    # ⇒ 脚本 `scripts/e2e-ops-log-coverage.sh` 保留，降级为**本地手动**跑
    #   （`make e2e-coverage`，需要本机 config/edge.json / .env 里的真 key）。
    # ⇒ 本 job 现在的职责：**在干净的 runner 上装 bundle、起真实宿主 profile、
    #   确认 http-api 拿到 bearer 正常起服** —— 不碰任何凭据。
    #
    # §7.198 的教训仍然有效（写在下面那步的注释里）：GitHub 禁止在 `if:` 条件里
    # 直接引用 `secrets`（文档原话：不能把 secrets 直接用在 if 条件里）⇒ 那样写
    # 会让**整个 workflow 文件被判无效**：run 的名字会变成文件路径
    # (".github/workflows/ci.yml")、jobs 为空、整条 CI 直接挂，而且**看不出原因**
    # （实测 run #151 就是这样）。
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm 必须先于 setup-node 装好（原因见文件头 §7.196）
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # §7.198: 这个 job 要跑宿主 DSH CLI（`@deepseek-ai/dsh`），而它发布的
          # engines 是 **node >= 24.9.0** ⇒ 用 22.20 装它/跑它都不对。
          # 本仓自己的 engines 是 `^22.19 || >=24` ⇒ 这个 job 用 24.13.0 合法。
          node-version: '24.13.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile
        run: pnpm run compile

      - name: Install DSH CLI
        run: |
          set +e
          npm install -g @deepseek-ai/dsh 2>&1 | tail -40
          DSH_INSTALL_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$DSH_INSTALL_EXIT" -ne 0 ]; then
            echo "::error::npm install -g @deepseek-ai/dsh 失败（exit=${DSH_INSTALL_EXIT}）"
            exit 1
          fi

      - name: Bootstrap DSH web profile (含 dsh-edge-agent bundle)
        run: |
          mkdir -p "$HOME/.dsh/profiles/web"
          dsh plugin --profile web add @dsh-edge/dsh-edge-agent || true
          NESTED="$HOME/.dsh/profiles/web/node_modules/@dsh-edge/dsh-edge-agent"
          mkdir -p "$NESTED"
          cp cordis.patch.yml "$NESTED/cordis.patch.yml"
          echo "已同步 bundle patch → $NESTED/cordis.patch.yml"

      - name: Trim web profile duplicate @deepseek-ai/* (§7.46.8)
        run: |
          # §7.46.8（2026-09-12）— web profile preset scope fix。
          # 删除 install.sh 自动加的 15 个重复 @deepseek-ai/*，避免 Symbol('dsh.scope') 双实例。
          bash scripts/fix-profile-duplicates.sh --profile=web

      # §7.221: edge HTTP API 的 bearer **现场生成**一把 —— 不再依赖
      # `DSH_EDGE_API_KEY` 这个 Actions secret（它不是外部凭据，是自己 API
      # 的门锁令牌，谁都能造）。令牌只落在本 run 的进程环境里，不入库、不回显。
      - name: 生成 edge HTTP API 的临时 bearer（§7.221）
        run: |
          TOKEN="$(node -e "console.log(require('crypto').randomBytes(24).toString('hex'))")"
          echo "DSH_EDGE_API_KEY=$TOKEN" >> "$GITHUB_ENV"
          echo "::notice::已生成临时 edge API bearer（本 run 内有效；不入库、不回显）"

      - name: Start dsh web profile (background)
        env:
          DSH_EDGE_HTTP_PORT: '21017'
        run: |
          export EDGE_API_KEY="$DSH_EDGE_API_KEY"
          if [ -z "${EDGE_API_KEY:-}" ]; then
            echo "::error::临时 edge API bearer 没拿到（GITHUB_ENV 未生效？）—— http-api 拿到空 token 会拒绝启动"
            exit 1
          fi
          cd "$HOME/.dsh/profiles/web"
          nohup dsh --profile web > /tmp/dsh-web.log 2>&1 &
          echo $! > /tmp/dsh-web.pid
          # 等待端口就绪
          for i in $(seq 1 30); do
            if curl -s --max-time 2 http://127.0.0.1:21017/health > /dev/null 2>&1; then
              echo "web profile ready after ${i}s"
              break
            fi
            sleep 1
          done

      # §7.221 (2026-11-13): 这里原来有「检查 e2e 凭据」+「Run ops log
      # coverage regression」两步（`if: env.DEEPSEEK_API_KEY != ''`）。
      # ⇒ **两步都删了**：主人裁定 `DEEPSEEK_API_KEY` 这个 secret 不用，而仓库里
      # 它**本来就没配过**（Actions secrets 列表 total_count = 0）⇒ 那一步
      # **永远 skipped** ⇒ 留着就是一段永不执行的死代码 + 一条永远为假的门禁。
      # ⇒ ops log 覆盖回归改由**本地手动**跑：`make e2e-coverage`
      #   （需要本机 config/edge.json / .env 里的真 key）。

      - name: Upload ops log for debugging
        if: always()
        run: |
          echo "=== last 50 lines of dsh-web.log ==="
          tail -50 /tmp/dsh-web.log || true
          echo "=== canary log slices ==="
          for sid in opslog-canary-mibao opslog-canary-news opslog-canary-local-ip; do
            echo "--- $sid ---"
            grep "$sid" ~/.dsh-edge-agent/log/dsh-edge-agent.log 2>/dev/null || echo "(no log)"
          done