# dsh-edge-agent CI — five stages: build → verify → unit → e2e-privacy → smoke.
#
# Triggered on every push to master and every PR. The full sequence is:
#   1. install (pnpm install --frozen-lockfile)
#   2. compile (tsc -p tsconfig.json → lib/types/)
#   3. verify  (verify:build = boundary + contract + patch-surface + plugin-spec + package)
#   4. unit    (vitest unit tests; asserts exact count via JSON reporter)
#   5. e2e     (bash scripts/e2e-privacy-precheck.sh; spins up real dsh server,
#               runs 19 注入 / 业务 / 路由 用例, must report 19/19 PASS)
#   6. smoke   (smoke.ts 冒烟)
#
# 任一阶段失败 → PR block。Gate 总数：
#   - 单元测试：必须 629 PASS（含 1 跳过）、0 FAIL（实际 628 用例 + 1 跳过）
#   - 隐私 E2E：必须 19/19 PASS（9 注入 → 400 + 5 业务 → 403 + 5 路由 → 200）

name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build & verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile
        run: pnpm run compile

      - name: Verify (boundary / contract / patch-surface / plugin-spec / package)
        run: pnpm run verify:build

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lib
          path: lib/
          retention-days: 7

  test:
    name: unit tests (628/628)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile
        run: pnpm run compile

      - name: Run unit tests (JSON reporter for count assertion)
        run: pnpm test -- --run --reporter=json --outputFile=/tmp/vitest.json || true

      - name: Assert test count
        run: |
          set -e
          TOTAL=$(node -e "const r=require('/tmp/vitest.json'); console.log(r.numTotalTests)")
          PASSED=$(node -e "const r=require('/tmp/vitest.json'); console.log(r.numPassedTests)")
          FAILED=$(node -e "const r=require('/tmp/vitest.json'); console.log(r.numFailedTests)")
          SKIPPED=$(node -e "const r=require('/tmp/vitest.json'); console.log(r.numSkippedTests)")
          echo "Total: $TOTAL, Passed: $PASSED, Failed: $FAILED, Skipped: $SKIPPED"
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::单元测试有 $FAILED 个 FAIL——PR block。"
            exit 1
          fi
          if [ "$TOTAL" -lt 600 ]; then
            echo "::error::测试总数 ($TOTAL) 远低于 628 基线——可能漏跑了部分用例，PR block。"
            exit 1
          fi

      - name: Run smoke test
        run: pnpm run smoke

  e2e-privacy:
    name: privacy e2e (19/19)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.20'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile
        run: pnpm run compile

      - name: Install DSH CLI
        run: npm install -g @deepseek-ai/dsh
        # dsh CLI 启动时读取 ~/.dsh/profiles/<name>/cordis.yml + bundles 列表，
        # 缺 bundle 注册会回到 vanilla 配置跑（缺少 dsh-edge-agent 全部 plugins）。
        # 2026-09-03 (§7.31): CI 跑 web profile (唯一 profile).

      - name: Bootstrap DSH web profile
        run: |
          # 2026-09-03 (§7.31): web profile is the only profile.
          # CI 创建 web profile + 注册 dsh-edge-agent bundle, 把 repo 根
          # cordis.patch.yml 同步到嵌套包, 确保 19 个 plugins 加载.
          mkdir -p "$HOME/.dsh/profiles/web"
          dsh plugin --profile web add @deepseek-harness-edge-agent/dsh-edge-agent || true
          NESTED="$HOME/.dsh/profiles/web/node_modules/@deepseek-harness-edge-agent/dsh-edge-agent"
          mkdir -p "$NESTED"
          cp cordis.patch.yml "$NESTED/cordis.patch.yml"
          cp cordis.yml "$NESTED/cordis.yml" 2>/dev/null || true
          echo "已同步 bundle patch → $NESTED/cordis.patch.yml"

      - name: Run privacy precheck e2e (must report 19/19)
        env:
          EDGE_API_KEY: test-secret-key
          DSH_EDGE_HTTP_PORT: '21017'
        run: bash scripts/e2e-privacy-precheck.sh