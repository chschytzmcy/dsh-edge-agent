# dsh-edge-agent publish workflow — triggered by tag push (vX.Y.Z).
#
# Pre-publish checklist:
#   1. pnpm run verify:build is green
#   2. pnpm test is green
#   3. CHANGELOG.md is updated
#   4. package.json#version is bumped
#   5. commit message uses Conventional Commits
#
# Publishing targets:
#   - npm     (public, requires NPM_TOKEN)      ← job `npm`
#   - git     (GitHub Release assets)            ← job `release` (§7.201)
#
# §7.201 (2026-11-12): 补上了**git 发布面** ——
# 在此之前，`release` job 建 GitHub Release 时**一个附件都没挂**
# （有 `generate_release_notes` 与 `fail_on_unmatched_files`，却**没有 `files:`**；
# 而 `fail_on_unmatched_files` 只有在挂了 `files:` 时才有意义 ⇒ 原意就是要挂，
# 只是那行从来没人写）。⇒ 结果：**两个变体的 tar 包都没有任何对外分发途径**
# （npm 只发 safe 变体，tar 包只存在于本地 dist/，而 dist/ 已 gitignore）。
#
# 现在 git 面**独立**跑（不 needs npm）、自己建包、自己过 `verify:tarball` 门禁，
# 再把 **safe 与 full 两个 tar 包逐个点名**挂上去。逐个点名而不是写
# `dist/*.tar.gz`：`*-DEMO.tar.gz` 里带着运维的**明文 API key**（§7.182），
# 而 release 是公开的 ⇒ 通配符是一次待发的凭据泄漏。
# 门禁：`scripts/verify-git-release.mjs`（形状）＋ `scripts/verify-tarball.mjs`（内容）。
#
# §7.196 (2026-11-12): 本文件此前**从没跑到过 publish 那一步** ——
# tag v0.1.3 的那次（run #3）失败点也是「Setup Node.js」，错误原文：
# 「Unable to locate executable file: pnpm」。
#
# 根因与修法与 ci.yml 完全同一处：**setup-node 与 pnpm/action-setup 的顺序反了**。
# setup-node 的 `cache: 'pnpm'` 要执行 `pnpm --version` 定位 store 路径，
# 而 pnpm 当时排在它后面 ⇒ pnpm 还不存在 ⇒ 该步直接失败 ⇒ 后面全 skipped。
# 现在 pnpm/action-setup 提到 setup-node **之前**，action 也升到 node24 版本
# （setup-node@v7 / checkout@v7 / pnpm/action-setup@v6）。
#
# ⇒ 推 tag 之前**必须先确认 ci.yml 绿了**：publish job 要靠它验证产物
# （lib/client.js、dist/installable/、dist/.npm-stage/），此前这一步从未跑过。

name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  npm:
    name: publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # pnpm 必须先于 setup-node 装好（原因见文件头 §7.196）
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # §7.156 (2026-10-30): the gates verify ARTIFACTS, not sources.
      #
      # This is the same trap ci.yml fell into on §7.154 — and §7.154 fixed
      # it THERE ONLY. publish.yml kept the old shape, so the npm channel
      # could never ship:
      #
      #   lib/client.js        ← build:client      (esbuild, browser half)
      #   dist/installable/…   ← build:installable (the shipped bundle)
      #
      # `pnpm run compile` alone = clean-lib + tsc, and clean-lib wipes lib/
      # ENTIRELY ⇒ lib/client.js is gone ⇒ verify:package reports
      #   "package exports missing from tarball: lib/client.js"
      # and a fresh checkout has no dist/ at all ⇒ verify:installable reports
      #   "installable dir not found"
      # ⇒ the publish job died at the Verify step, long before `pnpm publish`.
      #
      # This chain must stay identical to ci.yml's build job and to
      # package.json#scripts.build. scripts/verify-ci-build-chain.mjs gates
      # BOTH workflows now — without it, a dropped step here is invisible
      # until someone pushes a v* tag and watches it fail.
      #
      # §7.158: pack:tarball joined the chain because verify:build audits
      # dist/*.tar.gz as well (verify:tarball, §7.157) — a workflow that runs
      # the gates without producing the artifact they read dies at the Verify
      # step, exactly like the lib/client.js hole of §7.154.
      - name: Build (compile → browser half → installable bundle → tarballs)
        run: node scripts/run.mjs compile typecheck:client build:client build:installable pack:tarball stage:npm

      - name: Verify (boundary / contract / patch-surface / plugin-spec / package)
        run: pnpm run verify:build

      # §7.199: 原来是 `pnpm test -- --run`。那个 `--` 是**危险**的 ——
      # pnpm 某些版本会把字面 `--` 透传给脚本，vitest 的 CLI 解析器（cac）
      # 把 `--` 之后的一切当成**位置过滤器** ⇒ 这里的 `--run` 会被丢掉
      # （本仓的 test 脚本本来就含 `run`，所以丢掉也无害 —— 但同一种写法
      # 配上 `--reporter=json` 就会让 CI 的计数门禁**假绿**，见 ci.yml）。
      # ⇒ 参数一律靠 package.json 的脚本，不靠 `--` 转发。
      - name: Run tests
        run: pnpm test

      # A tag that does not match the manifest version publishes a version
      # nobody can find. Cheap to check, and the failure is otherwise silent:
      # the package lands on the registry under a version the repository does
      # not claim to be.
      #
      # §7.201: the check lives in ONE script (`scripts/verify-tag-version.mjs`)
      # because the git release job needs the same assertion — it ships the
      # same versioned artefacts (`0.1.3-desktop-safe` / `0.1.3-full`) — and two
      # copies of one rule drift.
      - name: Assert the tag matches package.json#version
        run: node scripts/verify-tag-version.mjs "$GITHUB_REF_NAME"

      # §7.172: the workflow's own pre-publish checklist asks for a CHANGELOG
      # that mentions this version. It is not decoration — npm renders it on
      # the package page, and "the changelog does not mention this version" is
      # the classic symptom of a release cut without notes.
      #
      # The check lives in the GATE script, not in a grep here: one
      # implementation, so the two cannot drift. (A local grep — e.g.
      # `grep -qE "^#{1,3} .*${VER}"` — is looser: `.` is a regex metacharacter
      # and there is no word boundary, so "0.1.1" would be satisfied by a
      # "0.1.10" heading.)
      - name: Assert CHANGELOG.md mentions this version
        run: node scripts/verify-npm-publish.mjs --check-changelog

      # §7.172: two decisions, both of which used to be guesswork.
      #
      #   skip       — is this version already on the registry? If so, SKIP
      #                publishing instead of failing with 409. This makes the
      #                local path and the CI path coexist: `npm run publish:npm
      #                -- --yes --tag` publishes, then the tag triggers this
      #                workflow, which sees the version is already there and
      #                steps aside — while the release job still builds the
      #                GitHub Release.
      #
      #   provenance — npm's attestation only accepts a PUBLIC source
      #                repository, AND pnpm asks the registry whether the
      #                package itself is public. Measured 2026-11-10:
      #
      #                  GET /-/package/<name>/visibility
      #                    package does not exist yet → HTTP 200 {"public":false}
      #                    existing public package  → HTTP 200 {"public":true}
      #
      #                So the FIRST publish of a brand-new package CANNOT carry
      #                --provenance: the registry answers "not public" for a
      #                package that does not exist yet. (docs/deploy-npm.md
      #                §8.5.1 predicted a 404 here — wrong shape, same verdict.)
      #                Later versions do carry the badge.
      - name: Decide (skip if published / provenance)
        id: decide
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: node scripts/publish-decision.mjs >> "$GITHUB_OUTPUT"

      # Authentication: a granular NPM_TOKEN if the secret exists, otherwise
      # OIDC trusted publishing (pnpm 11.7.0 implements the OIDC exchange
      # itself — crates/publish/src/oidc/* — so it does NOT need npm CLI >= 11.5.1
      # the way `npm publish` does; see docs/deploy-npm.md §8.5.2).
      #
      # Either way, `permissions: id-token: write` above is what makes the OIDC
      # path possible.
      #
      # §7.172 — `--no-git-checks` is NOT optional here. Measured 2026-11-10:
      #
      #   actions/checkout@v4 on a TAG push checks out a **detached HEAD**, and
      #   pnpm publish's git checks then fail outright:
      #
      #     $ pnpm publish --dry-run --ignore-scripts     # detached HEAD
      #     Error: ERR_PNPM_GIT_UNKNOWN_BRANCH
      #       × The Git HEAD may not attached to any branch, but your
      #         "publish-branch" is set to "master|main".
      #     exit 1
      #
      #   $ pnpm publish --dry-run --ignore-scripts --no-git-checks
      #     exit 0
      #
      # So without that flag this job would die at the publish step on EVERY
      # tag push — the §7.154 trap again (a workflow that looks complete but
      # can never ship), except this time it would only show up once someone
      # pushed a v* tag. The git checks have nothing to add in CI: a fresh
      # checkout is clean by construction, and the tag↔version and CHANGELOG
      # assertions above are the checks that actually matter.
      #
      # `--ignore-scripts` for the same reason in the other direction: the
      # Build step above already produced lib/ through the canonical chain and
      # `verify:build` gated THOSE artifacts. Letting `prepare` re-run
      # compile+build:client inside the publish step would ship a second,
      # ungated build. Ship exactly what the gates saw.
      # §7.188 (2026-11-11): 发布**不在仓库根**跑，而在 `dist/.npm-stage/` ——
      # 那个目录里摆的是「真正要发给 registry 的那个包」：内容 = safe 变体 +
      # README + LICENSE，清单 = 去掉 `scripts` / `devDependencies` / `packageManager`
      # 的那份（0.1.1 的毛病：清单声明了 50 余条脚本和一整套 devDeps，而它们指向的
      # 文件根本不在 tarball 里）。
      #
      # ⇒ **本地 dry-run 与 CI 真发仍是同一条命令**（`pnpm publish`），
      #   只是 cwd 换了个目录 —— 两边都从 `stage:npm` 产出的同一个暂存目录发。
      #   暂存目录由门禁 `verify:npm-stage` 守着（verify:build 链的最后一位）。
      - name: Publish
        if: steps.decide.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: dist/.npm-stage
        run: |
          if [ "${{ steps.decide.outputs.provenance }}" = "true" ]; then
            echo "带 --provenance 发布（会有溯源徽章）"
            pnpm publish --provenance --access public --ignore-scripts --no-git-checks
          else
            echo "不带 --provenance 发布（${{ steps.decide.outputs.provenance_reason }}）"
            pnpm publish --no-provenance --access public --ignore-scripts --no-git-checks
          fi

  release:
    name: git release (safe + full tarballs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # §7.201: 刻意**不**写 `needs: npm` ——
    # npm 与 git 是**两个独立的发布面**，谁也不能拖住谁：
    #   · npm 面会在 registry 或 token 出问题时挂（首发 token 2026-11-18 到期，
    #     2027-01 起 token 直发被移除）；
    #   · git 面只依赖 tag 与 GitHub 侧。
    # ⇒ git 面独立跑（自己建包、自己过门禁、自己发），npm 面挂了不影响它。
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # pnpm 必须先于 setup-node 装好（原因见文件头 §7.196）
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # §7.201: git 面**自己**建包（canonical 链，去掉 npm 专用的 stage:npm）。
      # 新鲜 checkout 里既没有 lib/ 也没有 dist/ ⇒ 不建就发，release 步会以
      # 「no files matched」失败，而那时 tag 已经推出去了。
      - name: Build (compile → browser half → installable bundle → tarballs)
        run: node scripts/run.mjs compile typecheck:client build:client build:installable pack:tarball

      # §7.201: **谁发谁验** —— tarball 在发它的这个 job 里过门禁
      # （与 npm 面同一条规矩：ship exactly what the gates saw）。
      - name: Verify (tarballs)
        run: node scripts/verify-tarball.mjs

      - name: Assert the tag matches package.json#version
        run: node scripts/verify-tag-version.mjs "$GITHUB_REF_NAME"

      # §7.201: 附件**逐个点名**，不用通配符 ——
      # `dist/*.tar.gz` 会连 `*-DEMO.tar.gz` 一起扫进去，而那两个 DEMO 包里
      # 带着运维的**明文 API key**（§7.182）。release 是公开的 ⇒ 通配符就是
      # 一次待发的凭据泄漏。门禁 scripts/verify-git-release.mjs 盯着这件事。
      - name: Create GitHub release (safe + full tarballs)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/dsh-edge-agent-desktop-safe.tar.gz
            dist/dsh-edge-agent-full.tar.gz